<title>Progress v2 prototype</title>
<style>
:root{--bg:#0f0f10;--line:rgba(255,255,255,.11);--text:#f3f3f1;--muted:#c8c7c4;--brand:#8d5e63;--brand-soft:rgba(141,94,99,.18);--nav:#c99ca1;--ok:#dfe7df;--fs:.65rem;--fb:.76rem}
*{box-sizing:border-box}
body{margin:0;background:#1a1a1c;color:var(--text);font:500 var(--fb)/1.4 -apple-system,system-ui,sans-serif}
.phone{width:375px;max-width:100%;margin:16px auto;background:var(--bg);padding:12px 16px 32px;position:relative;min-height:700px;overflow:hidden}
h2{font-size:1.4rem;margin:4px 0 2px}h3{font-size:var(--fs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
h4{font-size:var(--fb);margin:10px 0 4px}
p{margin:4px 0}
.card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:22px;padding:14px 12px;margin:10px 0}
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}.expl{color:var(--muted);font-size:var(--fs);margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:var(--fs);padding:6px 8px;cursor:pointer;min-height:32px}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--text)}
.sample{background:#3a2a10;color:#ffd79a;border:1px solid #8a6420;border-radius:10px;padding:6px 8px;font-weight:700;margin:8px 0;text-align:center;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.stat{background:rgba(255,255,255,.04);border-radius:14px;padding:8px;text-align:center}.stat strong{display:block;font-size:1.05rem}
.st-imp{color:var(--ok)}.st-watch{color:var(--nav)}
.grid{display:grid;grid-template-columns:34px repeat(6,1fr) 42px;gap:3px;align-items:center}
.cell{height:16px;border-radius:4px;border:1px solid var(--line)}
.cell.on{background:var(--brand)}.cell.dl{background:var(--brand-soft)}.cell.miss{border:1px dashed var(--nav)}
.row{border-top:1px solid var(--line);padding:8px 0;cursor:pointer;display:block;width:100%;background:none;color:inherit;text-align:left;font:inherit;border-left:0;border-right:0;border-bottom:0}
.row:first-of-type{border-top:0}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0}.chips span{background:var(--brand-soft);border-radius:8px;padding:1px 6px}
.chips span.prev{background:none;border:1px solid var(--line);color:var(--muted)}
.badge{font-size:var(--fs);border-radius:8px;padding:1px 6px;border:1px solid var(--line);margin-left:4px}
.b-imp{border-color:#7f957f;color:var(--ok)}.b-watch{border-color:var(--nav);color:var(--nav)}
.bar{display:grid;grid-template-columns:78px 1fr 56px;align-items:center;gap:6px;margin:4px 0}
.track{position:relative;height:10px;background:rgba(255,255,255,.06);border-radius:4px}
.band{position:absolute;top:0;height:10px;background:rgba(223,231,223,.12);border-left:1px dashed #7f957f;border-right:1px dashed #7f957f}
.fill{position:relative;height:10px;background:var(--brand);border-radius:4px}.tick{position:absolute;top:-3px;width:2px;height:16px;background:var(--text)}
select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit;padding:4px 6px}
.sheet{position:absolute;inset:0;background:var(--bg);padding:12px 16px;overflow:auto;display:none}
.sheet.open{display:block}
.back{background:none;border:0;color:var(--nav);font:inherit;padding:8px 0;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{padding:4px 2px;border-top:1px solid var(--line);text-align:left;font-weight:500}th{color:var(--muted);font-size:var(--fs)}
svg text{fill:var(--muted);font-size:9px}
details summary{cursor:pointer;color:var(--muted)}
button:focus-visible,select:focus-visible{outline:2px solid var(--nav);outline-offset:2px}
</style>

  if(h){const t=top(s);if(t>h.top)out.push({s,type:'heaviest',w:t,r:Math.max(...s.sets.filter(x=>x[0]===t).map(x=>x[1]))});
   else{for(const [w,r] of s.sets){if(h.repsAt[w]!==undefined&&r>h.repsAt[w]){out.push({s,type:'reps',w,r});break}}}}
  const nh=h||{top:0,repsAt:{}};nh.top=Math.max(nh.top,top(s));for(const [w,r] of s.sets)nh.repsAt[w]=Math.max(nh.repsAt[w]||0,r);seen[key]=nh}
 return out.reverse()}
function watchMsg(all,s,L){const t=TARGET[s.day+'|'+s.id];const p=prevEquivalent(all,s);const last=s.sets.at(-1);const tx=(k,o)=>T[L][k].replace(/\{(\w+)\}/g,(_,x)=>o[x]);
 if(t&&last[1]<t)return tx('W1',{r:last[1],t});
 if(p&&top(p)===top(s)&&compare(s,p)!=='improved')return tx('W3',{w:fmt(top(s),L)});
 if(!p)return tx('W6',{d:dfmt(s.date,L)});return null}
// ---- render ----
let L='en',MODE='real',OPEN=null;
const fmt=(n,l)=>n.toLocaleString(l==='es'?'es-ES':'en-GB',{maximumFractionDigits:1});
const dfmt=(d,l)=>new Date(d+'T12:00:00Z').toLocaleDateString(l==='es'?'es-ES':'en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const nm=id=>NAMES[L][id]||id;
function tx(k,o={}){return (T[L][k]||k).replace(/\{(\w+)\}/g,(_,x)=>o[x])}
function render(){const all=MODE==='real'?realSessions():sampleSessions();const today=MODE==='real'?'2026-10-10':'2026-11-28';const curWeek=MODE==='real'?1:8;
 const app=document.getElementById('app');const wkSess=all.filter(s=>s.week===curWeek);const last7=all.filter(s=>s.date>addDays(today,-7));
 const st={improved:0,held:0,watch:0,baseline:0};const rows=last7.map(s=>{const p=prevEquivalent(all,s);const c=compare(s,p);st[c]++;return{s,p,c}});
 let h=`<div class="top"><h2>${tx('title')}</h2><div class="seg" role="group" aria-label="Language"><button data-l="en" aria-pressed="${L==='en'}">EN</button><button data-l="es" aria-pressed="${L==='es'}">ES</button></div></div>
 <p class="muted">${tx('block')} · ${tx('week',{w:curWeek})}</p>
 <div class="seg" role="group" aria-label="Data"><button data-m="real" aria-pressed="${MODE==='real'}">${tx('real')}</button><button data-m="sample" aria-pressed="${MODE==='sample'}">${tx('sample')}</button></div>
 ${MODE==='sample'?`<div class="sample">${tx('sampleBanner')}</div>`:''}`;
 // Summary
 const watchList=rows.map(r=>({r,m:watchMsg(all,r.s,L)})).filter(x=>x.m&&x.r.c!=='baseline').slice(0,3);
 h+=`<section class="card"><h3>${tx('summary')}</h3>${st.improved+st.held+st.watch===0?`<p>${tx('firstWeek')}</p>`:''}
 <div class="stats num"><div class="stat"><strong class="st-imp">${st.improved}</strong>${tx('improved')}</div><div class="stat"><strong>${st.held}</strong>${tx('held')}</div><div class="stat"><strong class="st-watch">${st.watch}</strong>${tx('watch')}</div></div>
 ${st.baseline?`<p class="muted">${tx('baseline')}: ${st.baseline}</p>`:''}
 <h4>${tx('watchNext')}</h4>${watchList.length?watchList.map(x=>`<p>• <b>${nm(x.r.s.id)}</b> (${T[L].day[x.r.s.day]}): ${x.m}</p>`).join(''):`<p class="muted">${tx('none')}</p>`}
 ${MODE==='real'?`<p class="muted">• ${tx('W5')}</p>`:''}<p class="expl">${tx('sumExpl')}</p></section>`;
 // Consistency
 const weeks=MODE==='real'?[1]:[1,2,3,4,5,6,7,8];const done=new Set(all.map(s=>s.week+'|'+s.day));
 let g=`<div class="grid num" aria-hidden="true"><span></span>${DAYS.map(d=>`<span class="muted" style="font-size:var(--fs)">${({'chest-back':L==='es'?'PE':'CB','arms':L==='es'?'BR':'AR','lower-body':L==='es'?'PI':'LB'})[d.slice(0,-2)]} ${d.slice(-1).toUpperCase()}</span>`).join('')}<span></span>`;
 for(const w of weeks){const n=DAYS.filter(d=>done.has(w+'|'+d)).length;g+=`<span class="muted">W${w}</span>${DAYS.map(d=>{const on=done.has(w+'|'+d);const past=MODE==='sample'||DAYS.indexOf(d)<5;return`<i class="cell ${on?(w===6?'dl':'on'):(past?'miss':'')}" title="${T[L].day[d]}"></i>`}).join('')}<span class="muted">${n}/6</span>`}
 g+='</div>';
 const pS=DAYS.reduce((a,d)=>a+PLAN[d].reduce((x,e)=>x+e[1],0),0);const doneS=wkSess.reduce((a,s)=>a+s.sets.length,0);const doneD=new Set(wkSess.map(s=>s.day)).size;
 const miss=DAYS.filter(d=>!done.has(curWeek+'|'+d)).map(d=>T[L].day[d]);
 let hit=0,tot=0;for(const s of all.filter(s=>s.week>curWeek-4&&!s.deload)){const t=TARGET[s.day+'|'+s.id];if(!t)continue;for(const x of s.sets){tot++;if(x[1]>=t)hit++}}
 h+=`<section class="card"><h3>${tx('cons')}</h3><p class="num"><b>${tx('consLine',{d:doneD,p:6,s:doneS,ps:pS})}</b></p>${g}
 ${miss.length?`<p class="muted">${tx('missing',{d:miss.join(', ')})}</p>`:''}<p class="num">${tx('adh',{r:Math.round(hit/tot*100)})}</p><p class="expl">${tx('consExpl')}</p></section>`;
 // Per exercise
 const byDay={};for(const r of rows)(byDay[r.s.day]=byDay[r.s.day]||[]).push(r);
 h+=`<section class="card"><h3>${tx('perEx')}</h3><select aria-label="Day" id="daysel">${Object.keys(byDay).map(d=>`<option value="${d}">${T[L].day[d]} · ${dfmt(byDay[d][0].s.date,L)}</option>`).join('')}</select><div id="exlist"></div><p class="expl">${tx('perExpl')}</p></section>`;
 // Best marks
 const rec=records(all).slice(0,6);
 h+=`<section class="card"><h3>${tx('best')}</h3>${rec.length?rec.map(r=>`<p class="num"><b>${nm(r.s.id)}</b> · ${r.type==='heaviest'?tx('heaviest'):tx('moreReps',{w:fmt(r.w,L)})}: ${fmt(r.w,L)} kg × ${r.r}<br><span class="muted">${dfmt(r.s.date,L)} · ${T[L].day[r.s.day]}</span></p>`).join(''):`<p>${tx('bestEmpty')}</p>`}<p class="expl">${tx('bestExpl')}</p></section>`;
 // Sets per muscle
 const lastFull=MODE==='real'?1:7;const ms=w=>{const m={};for(const s of all.filter(s=>s.week===w)){const g=MUSCLE[s.id];if(g)m[g]=(m[g]||0)+s.sets.length}return m};
 const cur=ms(lastFull);const prevW=[lastFull-1,lastFull-2,lastFull-3].filter(w=>w>=1);const avg={};for(const w of prevW){const m=ms(w);for(const k in m)avg[k]=(avg[k]||0)+m[k]/prevW.length}
 const max=36;h+=`<section class="card"><h3>${tx('sets')} · ${tx('week',{w:lastFull})}</h3><p class="muted">${tx('setsUnit')}</p>`;
 for(const k of Object.keys(MG.en)){const v=cur[k]||0;h+=`<div class="bar num"><span>${MG[L][k]}</span><div class="track"><i class="band" style="left:${10/max*100}%;width:${10/max*100}%"></i><div class="fill" style="width:${Math.min(v,max)/max*100}%"></div>${avg[k]!==undefined?`<i class="tick" style="left:${Math.min(avg[k],max)/max*100}%"></i>`:''}</div><span>${v}${avg[k]!==undefined?' / '+fmt(avg[k],L):''}</span></div>`}
 h+=`<p class="expl">${tx('setsExpl')}</p></section>`;
 // Tonnage
 const ton=weeks.map(w=>all.filter(s=>s.week===w).reduce((a,s)=>a+s.sets.reduce((x,y)=>x+y[0]*y[1],0),0));const tm=Math.max(...ton);
 h+=`<section class="card"><h3>${tx('ton')}</h3><p class="muted">${tx('tonUnit')}</p><svg viewBox="0 0 320 90" width="100%" role="img" aria-label="${tx('ton')}">${ton.map((v,i)=>{const bw=Math.min(30,300/weeks.length-6),x=10+i*(300/weeks.length),hh=v/tm*60;return`<rect x="${x}" y="${70-hh}" width="${bw}" height="${hh}" rx="3" fill="${weeks[i]===6?'rgba(141,94,99,.4)':'#8d5e63'}"/><text x="${x+bw/2}" y="84" text-anchor="middle">W${weeks[i]}</text><text x="${x+bw/2}" y="${66-hh}" text-anchor="middle">${Math.round(v/1000)}k</text>`}).join('')}</svg><p class="expl">${tx('tonExpl')}</p></section>`;
 h+=`<div class="sheet" id="sheet"></div>`;
 app.innerHTML=h;
 const sel=document.getElementById('daysel');const drawList=()=>{document.getElementById('exlist').innerHTML=(byDay[sel.value]||[]).map(r=>`<button class="row" data-ex="${r.s.id}" data-day="${r.s.day}"><b>${nm(r.s.id)}</b><span class="badge ${r.c==='improved'?'b-imp':r.c==='watch'?'b-watch':''}">${tx(r.c)}</span>
  <div class="chips num">${r.s.sets.map(x=>`<span>${fmt(x[0],L)}×${x[1]}</span>`).join('')}</div>
  ${r.p?`<div class="chips num"><span class="muted" style="background:none">${tx('vsPrev',{d:dfmt(r.p.date,L)})}</span>${r.p.sets.map(x=>`<span class="prev">${fmt(x[0],L)}×${x[1]}</span>`).join('')}</div>`:`<span class="muted">${tx('noPrev')}</span>`}</button>`).join('')};
 sel.onchange=drawList;drawList();
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{L=b.dataset.l;render()});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;render()});
 app.onclick=(e=>{const b=e.target.closest('[data-ex]');if(b)openDetail(all,b.dataset.ex,b.dataset.day)});
}
function openDetail(all,id,day){const list=all.filter(s=>s.id===id&&s.day===day&&!s.deload);const sh=document.getElementById('sheet');const tr=trend(list);
 const pts=list.map(s=>metric(s));const kind=pts.some(p=>p.kind==='e1rm')?'e1rm':'kgxreps';const vals=pts.map(p=>p.v);const mn=Math.min(...vals)*.97,mx=Math.max(...vals)*1.03||1;
 const X=i=>30+i*(280/Math.max(1,list.length-1)),Y=v=>80-(v-mn)/(mx-mn||1)*65;let best=-1;
 const svg=list.length>1?`<svg viewBox="0 0 320 100" width="100%" role="img" aria-label="${tx(kind)}"><text x="2" y="${Y(mx)+4}">${Math.round(mx)}</text><text x="2" y="${Y(mn)}">${Math.round(mn)}</text><path d="${vals.map((v,i)=>(i?'L':'M')+X(i)+','+Y(v)).join(' ')}" fill="none" stroke="#c99ca1" stroke-width="2"/>${vals.map((v,i)=>{const b=v>best&&i>0;if(v>best)best=v;return`<circle cx="${X(i)}" cy="${Y(v)}" r="${b?5:3}" fill="${b?'none':'#c99ca1'}" stroke="#f3f3f1" stroke-width="${b?1.5:0}"/>`}).join('')}${list.map((s,i)=>`<text x="${X(i)}" y="96" text-anchor="middle">${s.date.slice(8)}/${s.date.slice(5,7)}</text>`).join('')}</svg>`:'';
 sh.innerHTML=`<button class="back" id="bk">${tx('back')}</button><h2 style="font-size:1.05rem">${nm(id)}</h2><p class="muted">${T[L].day[day]}</p>
 <section class="card"><h3>${tx('trend')}: ${tr?tx(tr):''}</h3>${tr?'':`<p>${tx('notEnough')}</p>`}<p class="muted">${tx(kind)}</p>${svg}<p class="expl">${tx('detailExpl',{d:T[L].day[day]})}</p></section>
 <section class="card"><h3>${tx('last4')}</h3><table class="num"><tr><th>${tx('date')}</th><th>${tx('setsH')}</th><th>${tx('st')}</th></tr>${list.slice(-4).reverse().map(s=>`<tr><td>${dfmt(s.date,L)}</td><td>${s.sets.map(x=>fmt(x[0],L)+'×'+x[1]).join(' ')}</td><td>${tx(compare(s,prevEquivalent(all,s)))}</td></tr>`).join('')}</table></section>`;
 sh.classList.add('open');sh.scrollTop=0;document.getElementById('bk').onclick=()=>sh.classList.remove('open')}
render();
})();
</script>
