<title>Today Block Header</title>
<style>
:root{--bg:#0f0f10;--soft:#171719;--card:#1d1d20;--line:#2a2a2e;--tx:#f3f3f4;--mut:#9a9aa2;--rose:#e8557a;--rose2:rgba(232,85,122,.14);--ok:#5fcf8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:#09090a;padding:8px 16px;border-bottom:1px solid var(--line)}

.pad{padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}

.btns{display:flex;gap:8px}.btn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--tx);font:inherit;font-weight:600}.btn.p{background:var(--rose);border-color:var(--rose);color:#fff}
.line{width:100%;display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--tx);font:inherit;text-align:left;margin-bottom:10px}

.wk{display:flex;align-items:center;gap:8px;margin-bottom:6px}.wk button{background:var(--soft);border:1px solid var(--line);color:var(--tx);width:32px;height:32px;border-radius:50%;font-size:16px}.wk button:disabled{opacity:.3}.wk .l{flex:1;text-align:center;font-weight:600}.wk .l small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.back{background:var(--rose2);color:var(--rose);border:0;border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;margin-bottom:8px}

.ring{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}

.row{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.row span{flex:1}
.seg2{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin:8px 0 4px}.seg2 button{flex:1;border:0;border-radius:8px;padding:7px;background:none;color:var(--mut);font:inherit}.seg2 .on{background:var(--rose);color:#fff}
details{border-top:1px solid var(--line);padding:10px 0}summary{font-weight:600}.x{background:none;border:0;color:var(--mut);font-size:18px;float:right}

.fr{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;scroll-snap-type:x mandatory}

.bd.done{background:var(--ok);color:#0f0f10}.bd.today{background:var(--rose)}.bd.next{border:2px solid var(--rose)}.bd.up{border:1.5px solid var(--line)}
.f1{width:84px;height:76px;padding-top:24px!important}.f2{width:76px;height:56px;padding-top:24px!important}.f3{width:76px;height:64px}

.fk.f2{display:flex!important;flex-direction:row!important;align-items:center;justify-content:center;gap:6px;width:92px!important;flex:0 0 92px!important;height:44px!important;padding:0 8px!important}
.fk.f2 .dl1{order:1;white-space:nowrap;font-size:15px;line-height:20px;position:static!important}
.fk.f2 .bd{order:2;position:static!important;margin:0!important;flex:none}

 if(wk!==M.cur)h+=`<button class="back" onclick="S.wk=${M.cur};S.sel=null;render()">↩ ${t.back}</button>`;return h}
function body(M){const t=T[S.lang],sel=selDay(M);if(sel===null)return `<div class="ex">${t.tap}</div>`;const s=M.st(S.wk,sel);
 if(s==='today')return `<div class="ex">${t.work}</div><div class="ex"></div>`;
 if(s==='done')return `<div class="ex">✓ ${dname(sel)} · ${t.sum2} ›</div>`;
 return `<div class="pv"><div class="eyebrow">${t.prev} · ${dlabel(S.wk,sel)}</div><h3>${dname(sel)}</h3><small style="color:var(--mut)">${dfocus(sel)}</small><div class="note2">${t.target}</div>`+
  DAYS[sel].ex.map(e=>`<div class="er"><span>${S.lang==='es'?e[1]:e[0]}<br><small>${t.tech[e[4]]||e[4]}</small></span><small>${e[2]} × ${e[3]}</small></div>`).join('')+`<button class="lock" disabled>🔒 ${t.lock}</button></div>`}
function days(M){const t=T[S.lang],wk=S.wk,sel=selDay(M);let h='';
 if(S.days==='0'){h+=weekSwitch(M)+'<div class="tabs">'+DAYS.map((d,i)=>{const p=M.prog(wk,i),s=M.st(wk,i);return `<div class="tab ${i===sel?'a':''}" onclick="S.sel=${i};render()"><b>D${i+1}</b>${p[0]}/${p[1]}${s==='today'?'<div>'+t.tod+'</div>':''}</div>`}).join('')+'</div>'}
 if(S.days==='1'&&S.fit!=='0'){const cls='f'+S.fit;h+=weekSwitch(M)+'<div class="fr">'+DAYS.map((d,i)=>{const s=M.st(wk,i),x=date(wk,i);
 const dl1=`<span class="dl1">${t.wd[i]} ${x.d}</span>`;const inner=S.fit==='1'?`${dl1}<span class="s">${SHORT[S.lang][i]}</span>`:S.fit==='2'?dl1:`<span class="ic" aria-hidden="true">${ICON[i]}</span>${dl1}`;
 return `<button class="fk ${cls} ${i===sel?'a':''} ${s==='today'?'td':''}" aria-label="${dlabel(wk,i)} · ${dname(i)}" onclick="S.sel=${i};render()"><span class="bd ${s}">${s==='done'?'✓':''}</span>${inner}</button>`}).join('')+'</div>';
 if(sel!==null){const s=M.st(wk,sel);h+=`<div class="cap">${s==='today'||s==='next'?`<span class="tg2">${s==='today'?t.tod:t.next} · ${dlong(wk,sel)}</span>`:`<small>${dlong(wk,sel)}</small>`}<b>${dname(sel)}</b><small>${dfocus(sel)}</small></div>`}
 return h+body(M)}
 if(S.days==='1'){h+=weekSwitch(M)+'<div class="dch" id="dch">'+DAYS.map((d,i)=>{const s=M.st(wk,i),tg=s==='today'?t.tod:s==='next'?t.next:'';return `<button class="dc ${i===sel?'a':''} ${s==='next'?'nx':''} ${s==='today'?'td':''}" onclick="S.sel=${i};render()">${s==='up'||s==='next'?'<span class="ring" style="border:1.5px solid var(--line)"></span>':ring(M.prog(wk,i),s)}<b>${dlabel(wk,i)}</b><span class="dn">${dname(i)}</span>${tg?`<span class="tg">${tg}</span>`:''}</button>`}).join('')+'</div>'}
 if(S.days==='2'){h+=weekSwitch(M)+'<div class="dl">'+DAYS.map((d,i)=>{const s=M.st(wk,i),x=date(wk,i);return `<button class="dr ${i===sel?'a':''}" onclick="S.sel=${i};render()"><span class="dt"><small>${t.wd[i]}</small><b>${x.d}</b></span><span class="nm"><b>${dname(i)}</b><small>${dfocus(i)}</small></span>${stBadge(s)}</button>`}).join('')+'</div>'}
 if(S.days==='3'){const home=wk===M.cur&&!S.weekOpen;
  if(home){const i=M.today,p=M.prog(wk,i),n=M.next;const nn=n.i;
   h+=`<div class="fc" onclick="S.sel=${i};render()"><div class="eyebrow">${t.tod} · ${dlabel(wk,i)}</div><h2>${dname(i)}</h2><small>${dfocus(i)}</small><div class="pbar"><i style="width:${p[0]/p[1]*100}%"></i></div><small>${f(t.of,{a:p[0],b:p[1]})}</small></div>`;
   h+=`<button class="nxl" onclick="S.wk=${n.w};S.sel=${nn};S.weekOpen=true;render()"><span style="flex:1"><small style="color:var(--rose)">${t.next} · ${dlabel(n.w,nn)}</small><br><b>${dname(nn)}</b> <small style="color:var(--mut)">· ${dfocus(nn)}</small></span><span style="color:var(--mut)">›</span></button>`;
   h+='<div class="dots">'+DAYS.map((d,i)=>{const s=M.st(wk,i);return `<button class="${s==='done'?'d':''} ${s==='today'?'t':''}" onclick="S.sel=${i};S.weekOpen=true;render()">${t.wd[i]}<br>${s==='done'?'✓':date(wk,i).d}</button>`}).join('')+'</div>';
   h+=`<button class="lnk" onclick="S.weekOpen=true;render()">${t.showWeek} ›</button>`;}
  else{h+=weekSwitch(M)+'<div class="dl">'+DAYS.map((d,i)=>{const s=M.st(wk,i),x=date(wk,i);return `<button class="dr ${i===sel?'a':''}" onclick="S.sel=${i};render()"><span class="dt"><small>${t.wd[i]}</small><b>${x.d}</b></span><span class="nm"><b>${dname(i)}</b><small>${dfocus(i)}</small></span>${stBadge(s)}</button>`}).join('')+`</div><button class="lnk" onclick="S.weekOpen=false;S.wk=1;S.sel=null;render()">‹ ${t.hideWeek}</button>`;}
  if(home)return h+`<div class="ex">${t.work}</div>`;}
 return h+body(M)}
function render(){const t=T[S.lang],M=model(),isNew=S.st==='new';
 const B=(k,v,l)=>`<button class="${S[k]==v?'on':''}" onclick="S.${k}='${v}';S.wk=1;S.sel=null;S.weekOpen=false;render()">${l}</button>`;
 document.getElementById('bar').innerHTML=`<div class="grp"><em>Days</em>${B('days','0','Now')}${B('days','1','1 Chips ★')}${B('days','2','2 List')}${B('days','3','3 Focus')}</div><div class="grp"><em>Header</em>${B('v','A','A')}${B('v','B','B ★')}${B('v','C','C')}${B('st','compact','Compact')}${B('st','new','New block')}</div><div class="grp"><em>Fit</em>${B('fit','0','Off')}${B('fit','1','Fit 1')}${B('fit','2','Fit 2 ★')}${B('fit','3','Fit 3')}</div><div class="grp"><em>Lang</em>${B('lang','es','ES')}${B('lang','en','EN')}</div>`;
 document.getElementById('note').textContent=NOTES[S.v]+' '+DNOTES[S.days]+(S.days==='1'&&S.fit!=='0'?' '+FNOTES[S.fit]:'');
 const title=(S.v==='C'&&!isNew)?`<button onclick="S.open=true;render()" style="all:unset;cursor:pointer"><h1>${t.today}</h1><div style="color:var(--mut);font-size:12px">${t.bl} · ${f(t.wk,{w:1})} ›</div></button>`:`<h1>${t.today}</h1>`;
 let h=`<div class="top">${title}<button class="round" aria-label="${t.cal}" onclick="S.open=true;render()">📅</button></div><div class="pad">`;
 if(isNew)h+=`<section class="card"><button class="x" aria-label="${t.got}" onclick="S.st='compact';render()">×</button><div class="eyebrow">${t.newb} · ${t.bl} · PT</div><h2>${t.name}</h2><div class="chips"><span class="chip r">${f(t.wk,{w:1})}</span><span class="chip">${t.dates}</span><span class="chip">${t.full}</span></div><p>${t.sum}</p><div class="btns"><button class="btn" onclick="S.open=true;render()">${t.det}</button><button class="btn p" onclick="S.st='compact';render()">${t.got}</button></div></section>`;
else if(S.v==='B'&&S.days==='1'&&S.fit!=='0'){const seg='<span class="seg"><i class="c"></i><i></i><i></i><i></i><i></i><i></i></span>';
 h+= S.fit==='1'?`<button class="hl" onclick="S.open=true;render()"><span class="r">›</span><span class="t1">${t.bl} · ${S.lang==='es'?'Sem':'Wk'} 1/6</span>${seg}</button>`
 : S.fit==='2'?`<button class="hl" onclick="S.open=true;render()"><span class="r">›</span><span class="t1">${t.bl} · ${f(t.wk,{w:1})}</span><span class="t2">${t.name}</span>${seg}</button>`
 : `<button class="hl" onclick="S.open=true;render()"><span class="r">›</span><span class="pill">${S.lang==='es'?'Sem':'Wk'} 1/6</span><span class="t1">${t.bl}</span><span class="t2">${t.name}</span></button>`;}
 else if(S.v!=='C')h+=`<button class="line" onclick="S.open=true;render()"><span style="flex:1;min-width:0"><span style="display:flex;gap:8px"><b>${t.bl}</b><span class="m">${f(t.wk,{w:1})} · ${t.name}</span><span>›</span></span>${S.v==='B'?'<span class="seg"><i class="c"></i><i></i><i></i><i></i><i></i><i></i></span>':''}</span></button>`;
 h+=days(M)+'</div>';
 h+=`<div class="sheet ${S.open?'open':''}" onclick="if(event.target===this){S.open=false;render()}"><div class="sh"><div class="grab"></div><div class="eyebrow">${t.bl} · PT</div><h2 style="margin:4px 0">${t.name}</h2><div class="chips"><span class="chip r">${f(t.wk,{w:1})}</span><span class="chip">${t.dates}</span><span class="chip">${t.full}</span></div><div class="seg2"><button class="on">${t.preset}</button><button>${t.custom}</button></div><details><summary>${t.about}</summary><p style="color:var(--mut)">${t.sum}</p></details><div class="row"><span>📅 ${t.cal}</span>›</div><div class="row"><span>⇄ ${t.chg}</span>›</div><button class="btn" style="width:100%;margin-top:8px" onclick="S.open=false;render()">${t.close}</button></div></div>`;
 document.getElementById('phone').innerHTML=h;
 const a=document.querySelector('.dc.a,.fk.a')||document.querySelector('.dc.td,.fk.td');if(a){const c=a.parentElement;c.scrollLeft=a.offsetLeft-c.offsetLeft-(c.clientWidth-a.offsetWidth)/2;}}
render();
</script>
