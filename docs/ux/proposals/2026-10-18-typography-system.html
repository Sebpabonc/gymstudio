<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Typography System</title>
<style>
/* Prototype for docs/ux/proposals/2026-10-18-typography-system.md.
   One phone (390 px) + a notes panel. Variant x screen x language.
   Single dark look on purpose: it mirrors the GymStudio app (dark rose theme). */
:root {
  color-scheme: dark;
  --bg: #0b0b0c;
  --surface: #141416;
  --card: #18181a;
  --card-2: #1f1f22;
  --panel: rgba(255, 255, 255, 0.05);
  --line: rgba(255, 255, 255, 0.11);
  --text: #f3f3f1;
  --muted: #c8c7c4;
  --dim: #9a9895;
  --rose: #c99ca1;
  --brand: #8d5e63;
  --done: #a6d9a5;
  --btn: linear-gradient(135deg, #7a5d60, #2f2f31);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); padding: 16px 16px 40px; }
button { font: inherit; color: inherit; }
.top { max-width: 1040px; margin: 0 auto 14px; }
.top h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 700; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 20px; max-width: 72ch; }
.controls { max-width: 1040px; margin: 0 auto 16px; display: grid; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg > span { font-size: 12px; color: var(--dim); min-width: 64px; }
.seg button { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.seg button .rec { font-weight: 400; opacity: .85; }
.stage { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.notes { font-size: 14px; line-height: 20px; color: var(--muted); display: grid; gap: 12px; }
.notes h2 { margin: 0; font-size: 17px; line-height: 22px; color: var(--text); }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.notes table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.notes th, .notes td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.notes th { color: var(--dim); font-weight: 600; }
.notes .stat { display: flex; gap: 16px; flex-wrap: wrap; }
.notes .stat b { color: var(--text); font-size: 20px; display: block; font-variant-numeric: tabular-nums; }

/* ---------- phone ---------- */
.phone { width: 100%; max-width: 390px; height: 800px; border-radius: 36px; border: 1px solid var(--line); background: linear-gradient(180deg, #141415, #08080a); overflow: hidden; position: relative; }
.scroll { height: 100%; overflow-y: auto; padding: 0 16px 96px; }
.p * { margin: 0; }
.p { color: var(--text); font-family: var(--font-ui); }
.v-cur.p { font-family: Helvetica, Arial, sans-serif; } /* what the live app really renders: Inter is not loaded */
.row { display: flex; align-items: center; gap: 8px; }
.row.base { align-items: baseline; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.v-cur .card { padding: 13px; border-radius: 22px; }
.box { background: var(--card-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; display: grid; gap: 4px; }
.v-cur .box { padding: 10px 12px; margin: 0 13px; }
.pill { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.iconbtn { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: 0 0 auto; }
.btn { min-height: 48px; border-radius: 14px; background: var(--btn); color: #fff; display: grid; place-items: center; padding: 0 16px; width: 100%; border: 0; }
.btn2 { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0 12px; }
.tag { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(141, 94, 99, .28); color: var(--rose); }
.ok { color: var(--done); }
.mut { color: var(--muted); }
.gap16 { display: grid; gap: 16px; }
.gap12 { display: grid; gap: 12px; }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic16 { width: 16px; height: 16px; } .ic20 { width: 20px; height: 20px; }
.only-cur, .only-new, .only-comp, .only-few { }
.v-cur .only-new, .v-new .only-cur, .v-few .only-comp, .v-comp .only-few { display: none !important; }

/* top bars */
.bar { position: sticky; top: 0; z-index: 2; margin: 0 -16px; padding: 12px 16px; background: rgba(12, 12, 13, .92); display: flex; align-items: center; gap: 8px; min-height: 56px; }
.lang { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang span { min-width: 36px; min-height: 30px; display: grid; place-items: center; border-radius: 999px; }
.lang span.on { background: rgba(255, 255, 255, .1); color: var(--rose); }
.syncdot { width: 8px; height: 8px; border-radius: 99px; background: #e0b55a; }
.dock { position: absolute; left: 16px; right: 16px; bottom: 14px; height: 56px; border-radius: 999px; border: 1px solid var(--line); background: rgba(20, 20, 22, .94); display: flex; justify-content: space-around; align-items: center; color: var(--dim); }
.dock .on { color: var(--rose); }

/* week strip */
.week { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.week i { display: block; width: 100%; height: 6px; border-radius: 99px; background: var(--brand); }
.week div { display: grid; gap: 6px; justify-items: center; }
.week div.on i { outline: 2px solid var(--rose); outline-offset: 2px; }

/* workout */
.chips { display: flex; gap: 6px; overflow: hidden; }
.chips span { min-width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #9fd49e; color: #142014; }
.chips span.cur { background: rgba(141, 94, 99, .25); border: 1px solid var(--brand); color: var(--rose); }
.chips span.todo { background: var(--panel); border: 1px solid var(--line); color: var(--dim); }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tools > span { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 4px; overflow: hidden; white-space: nowrap; }
.v-new .tools > span { flex-direction: column; min-height: 52px; gap: 3px; color: var(--muted); }
.cue { display: grid; grid-template-columns: 36px minmax(0, 1fr) 28px; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 1px solid rgba(201, 156, 161, .3); background: linear-gradient(135deg, rgba(141, 94, 99, .3), rgba(141, 94, 99, .08)); }
.cue .ci { width: 36px; height: 36px; border-radius: 10px; background: rgba(201, 156, 161, .18); display: grid; place-items: center; color: var(--rose); }
.cue .cc { width: 28px; height: 28px; border-radius: 99px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.logger { border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 8px; background: var(--panel); }
.v-cur .logger { padding: 14px; margin: 0 2px; }
.v-new .logger { margin: 0 -16px; border-radius: 0; border-left: 0; border-right: 0; padding: 12px 16px; }
.lrow { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 8px; }
.step { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 6px; }
.step i, .step b { height: 48px; border: 1px solid var(--line); border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .04); font-style: normal; }
.v-cur .step { grid-template-columns: 56px minmax(0, 1fr) 56px; } .v-cur .step i, .v-cur .step b { height: 56px; }
.v-cur .step i { font-size: 21.6px; font-weight: 700; }
.v-new .step i { font-size: 20px; font-weight: 400; color: var(--muted); }
.tbl { display: grid; }
.tr { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 12px; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; font-variant-numeric: tabular-nums; }
.v-cur .tr { min-height: 52px; }
.tr.th { min-height: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); border-radius: 0; }
.v-cur .tr.th { align-items: start; }
.v-new .tr.th { align-items: end; }
.tr.now { background: rgba(141, 94, 99, .16); box-shadow: inset 3px 0 0 var(--brand); }

/* superset */
.ss-ex { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.ss-ex:first-of-type { border-top: 0; padding-top: 0; }
.ss-head { display: grid; grid-template-columns: 28px minmax(0, 1fr) 24px; gap: 8px; align-items: start; }
.code { width: 28px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: rgba(141, 94, 99, .3); color: var(--rose); font-variant-numeric: tabular-nums; }
.ss-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: end; }
.ss-fields.two { grid-template-columns: minmax(0, 1fr) 44px; padding-left: 0; }
.ss-field { display: grid; gap: 4px; }
.ss-step { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; gap: 4px; }
.ss-step i, .ss-step b { height: 44px; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .04); font-style: normal; }
.ss-step i { color: var(--muted); font-size: 18px; }
.tick { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); display: grid; place-items: center; }
.tick.on { background: rgba(166, 217, 165, .18); border-color: rgba(166, 217, 165, .5); color: var(--done); }
.ss-two { display: grid; gap: 6px; }
.ss-two .lrow { grid-template-columns: 40px minmax(0, 1fr); }
.ss-line { display: flex; gap: 8px; align-items: baseline; min-height: 40px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); font-variant-numeric: tabular-nums; }
.ss-line.future { border-style: dashed; color: var(--dim); }
.handoff { padding: 8px 12px; border-radius: 10px; background: rgba(166, 217, 165, .1); color: var(--done); }
/* current superset (mirrors the PO's phone screenshot) */
.c-round { border: 1px solid rgba(201, 156, 161, .45); border-radius: 16px; padding: 12px; display: grid; gap: 8px; background: rgba(141, 94, 99, .12); }
.c-round.future { border-color: var(--line); background: rgba(255, 255, 255, .02); }
.c-tr { display: grid; grid-template-columns: 44px 1fr 1.6fr; gap: 8px; align-items: start; }
.c-tr.th { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.c-today { display: grid; gap: 4px; justify-items: stretch; }
.c-step { display: grid; grid-template-columns: 36px 1fr 36px; gap: 4px; }
.c-step i, .c-step b { height: 40px; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .05); font-style: normal; }
.c-tick { justify-self: end; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .06); }
.textarea { min-height: 60px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: rgba(255, 255, 255, .04); color: var(--dim); }

/* exercises */
.search { min-height: 44px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.rchips { display: flex; gap: 6px; overflow: hidden; }
.rchips span { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); display: grid; place-items: center; white-space: nowrap; }
.v-cur .rchips span { min-height: 34px; }
.rchips span.on { border-color: var(--brand); background: rgba(141, 94, 99, .25); }
.result { display: grid; grid-template-columns: 40px minmax(0, 1fr) 16px; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
.result .ri { width: 40px; height: 40px; border-radius: 12px; background: var(--panel); display: grid; place-items: center; color: var(--muted); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 24px 24px 0 0; border-top: 1px solid var(--line); background: #1b1b1e; padding: 16px 16px 24px; display: grid; gap: 12px; box-shadow: 0 -20px 60px rgba(0, 0, 0, .6); }
.sheet .grab { width: 36px; height: 5px; border-radius: 99px; background: var(--line); justify-self: center; margin-top: -6px; }
.scue { border-left: 3px solid var(--brand); background: rgba(141, 94, 99, .16); padding: 10px 12px; border-radius: 4px 12px 12px 4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* progress */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--panel); }
.tabs span { min-height: 36px; border-radius: 10px; display: grid; place-items: center; white-space: nowrap; }
.tabs span.on { background: var(--brand); color: #fff; }
.lift { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.lift:first-of-type { border-top: 0; padding-top: 0; }
.lift svg { width: 84px; height: 32px; color: var(--rose); stroke-width: 1.6; }

/* ===== ROLES (new variants) ===== */
.v-new .r-title { font: 700 28px/34px var(--font-ui); letter-spacing: -0.02em; text-wrap: balance; }
.v-new .r-card { font: 700 22px/28px var(--font-ui); letter-spacing: -0.01em; text-wrap: balance; }
.v-new .r-head { font: 600 17px/22px var(--font-ui); letter-spacing: -0.01em; text-wrap: balance; }
.v-new .r-body { font: 400 15px/20px var(--font-ui); }
.v-new .r-bodys { font: 600 15px/20px var(--font-ui); }
.v-new .r-cap { font: 400 13px/18px var(--font-ui); color: var(--muted); }

.v-new .wm { font: 800 15px/20px var(--font-ui); letter-spacing: -0.01em; text-transform: uppercase; }
/* Compact keeps every current capital, but in ONE style */
.v-comp .capsable { font: 600 11px/14px var(--font-ui) !important; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

function measure(root) {
  const sizes = new Set(); let caps = 0;
  root.querySelectorAll('*').forEach((el) => {
    const own = [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim().length > 0);
    if (!own || !el.offsetParent) return;
    const cs = getComputedStyle(el);
    sizes.add(Math.round(parseFloat(cs.fontSize) * 10) / 10);
    const txt = [...el.childNodes].filter((n) => n.nodeType === 3).map((n) => n.textContent).join('').replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g, '');
    if (txt.length >= 2 && (cs.textTransform === 'uppercase' || txt === txt.toUpperCase()) && !/^(EN|ES|C\d|R\d|CC|GYMSTUDIO)$/i.test(txt) && !el.closest('.wm,.c-word')) caps++;
  });
  return { sizes: [...sizes].sort((a, b) => a - b), caps };
}

function render() {
  try { localStorage.setItem('gs-type-proto', JSON.stringify(S)); } catch (e) {}
  const u = UI[S.l], t = T[S.l], n = NOTES[S.l];

  document.getElementById('lede').textContent = u.lede;
  const segBtn = (key, val, label) => `<button type="button" aria-pressed="${S[key] === val}" data-k="${key}" data-v="${val}">${label}</button>`;
  document.getElementById('controls').innerHTML = `
    <div class="seg" role="group" aria-label="${u.variant}"><span>${u.variant}</span>${segBtn('v', 'cur', u.cur)}${segBtn('v', 'comp', u.comp)}${segBtn('v', 'few', `${u.few} <span class="rec">${u.rec}</span>`)}</div>

    <div class="seg" role="group" aria-label="${u.lang}"><span>${u.lang}</span>${segBtn('l', 'en', 'EN')}${segBtn('l', 'es', 'ES')}</div>

}

});
