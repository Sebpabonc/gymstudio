<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>Workout Exercise Screen</title>
<style>
/* Prototype only (UXer 2026-10-18). Tokens copied from src/styles.css :root (dark rose theme). */
:root{color-scheme:dark;--bg:#0f0f10;--soft:#171719;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.11);--hair:rgba(255,255,255,.07);
--text:#f3f3f1;--muted:#c8c7c4;--dim:rgba(243,243,241,.6);--brand:#8d5e63;--brandsoft:rgba(141,94,99,.18);--rose:#c99ca1;--btn:linear-gradient(135deg,#7a5d60 0%,#2f2f31 100%);--ok:#dfe7df;--okbg:#a8d5a8}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#050506;color:var(--text);font-family:Inter,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none;border:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.num,.val,.tbl,.clock{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Switcher (outside the phone) */
.top{max-width:860px;margin:0 auto;padding:16px 16px 8px}
.top h1{font-size:15px;font-weight:800;letter-spacing:.02em}
.top p{color:var(--dim);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tab{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px}
.tab[aria-pressed=true]{border-color:var(--brand);background:var(--brandsoft);color:var(--rose)}
.tab .rec{font-size:10px;font-weight:800;color:var(--okbg);margin-left:4px}
.pitch{margin-top:10px;font-size:13px;color:var(--muted);min-height:36px}
.pitch b{color:var(--text)}
.stage{display:flex;justify-content:center;gap:28px;padding:8px 16px 40px;flex-wrap:wrap}
.notes{max-width:300px;color:var(--dim);font-size:12px;line-height:1.55}
.notes h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose);margin:4px 0 6px}
.notes li{margin:0 0 6px 16px}
.notes .reset{margin-top:10px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;font-weight:600;color:var(--text)}

/* Phone */
.phone{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 40px);min-height:640px;background:var(--bg);border:1px solid var(--line);border-radius:36px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:24px}
.scroll::-webkit-scrollbar{display:none}

/* Header */
.bar{position:sticky;top:0;z-index:6;background:var(--bg);padding:12px 16px 8px}
.barrow{display:flex;align-items:center;gap:8px}
.pill{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap}
.prog{flex:1;min-width:0;text-align:center;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog small{display:block;font-size:11.5px;color:var(--dim);font-weight:600}
.clock{font-size:13px;color:var(--muted);font-weight:600}
.chiprow{display:flex;align-items:center;gap:6px;margin-top:10px}
.chips{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.xchip{flex:none;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px}
.xchip.cur{border-color:var(--brand);background:var(--brandsoft);color:var(--rose)}
.xchip.done{background:var(--okbg);color:#14261a;border-color:transparent}
.langone{color:var(--rose);border-radius:99px;font-size:13px}
.ss{flex:none;width:8px;height:2px;background:var(--brand);align-self:center;margin:0 -3px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.lang button{color:var(--dim);font-weight:700;font-size:12px;min-width:44px;min-height:44px}
.lang button[aria-pressed=true]{background:var(--brandsoft);color:var(--rose)}
.lang.big button{min-width:56px;font-size:14px}
.segbar{display:flex;gap:3px;margin-top:10px}
.segbar i{flex:1;height:4px;border-radius:2px;background:var(--panel2)}
.segbar i.d{background:var(--okbg)}.segbar i.c{background:var(--rose)}

/* Card */
.wrap{padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:6px}
.namerow{display:flex;align-items:flex-start;gap:10px}
.name{flex:1;min-width:0;font-size:21px;font-weight:700;line-height:1.2;text-wrap:balance}
.name.light{font-weight:500}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:20px;color:var(--muted)}
.textbtn{flex:none;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.swapline{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.swapline button{min-width:44px;color:var(--rose);text-decoration:underline;text-underline-offset:2px;min-height:44px;padding:0 6px}
.swapline.small button{min-height:32px}
.icons{display:flex;gap:8px;margin-top:6px}
.ico{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center}
.ico svg,.seg svg,.textbtn svg,.link svg,.sheetbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.seg{min-height:52px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.seg svg{color:var(--text)}
.links{display:flex;flex-wrap:wrap;gap:0 4px;margin-top:6px}
.link{min-height:44px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--rose)}
.link:first-child{padding-left:0}
.cue{display:block;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-left:4px solid var(--brand);background:rgba(141,94,99,.12);border-radius:4px 12px 12px 4px;font-weight:700;font-size:15px;line-height:1.35;min-height:44px}
.cue .lab{letter-spacing:.04em}
.cue .more{color:var(--rose)}
.cue small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:4px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);display:inline-flex;align-items:center;font-size:12px;font-weight:700}
.tag.sub{color:var(--muted);font-weight:600}
.plan{font-size:13px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}
.plan b{color:var(--text);font-weight:700;letter-spacing:.04em;font-size:11.5px;text-transform:uppercase;margin-right:4px}

/* Logger */
.logger{margin-top:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:18px;padding:14px}
.lhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lhead strong{font-size:15px;letter-spacing:.03em}
.lhead span{font-size:12px;color:var(--muted)}
.lsub{font-size:12px;color:var(--muted);margin-top:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.flab{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.step{display:grid;gap:4px;grid-template-columns:44px minmax(0,1fr) 44px}
.step.cur{grid-template-columns:36px minmax(0,1fr) 36px}
.step button{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:22px;font-weight:600}
.step .val{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:28px;font-weight:800}
.logbtn{width:100%;min-height:60px;border-radius:16px;background:var(--btn);font-weight:800;font-size:17px;letter-spacing:.06em;margin-top:12px;color:#fff}
.tbl{margin-top:12px;width:100%;font-size:13.5px}
.tr{display:grid;grid-template-columns:28px 1fr 1fr 1fr;align-items:center;min-height:44px;padding:0 8px;border-radius:10px}
.tr.th{min-height:32px;font-size:11.5px;color:var(--muted);font-weight:700}
.tr.now{background:rgba(141,94,99,.16);box-shadow:inset 3px 0 0 var(--brand)}
.tr.ok{color:var(--ok)}
.tbl3 .tr{grid-template-columns:28px 1fr 1.2fr}
.tr .dim{color:var(--dim)}
.addnote{margin-top:6px}
textarea{width:100%;margin-top:8px;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px;font:inherit;resize:vertical}

/* Rest */
.rest{margin-top:14px;border-radius:18px;padding:16px;background:linear-gradient(160deg,rgba(141,94,99,.28),rgba(255,255,255,.03));border:1px solid var(--brand);text-align:center}
.rest .lbl{font-size:12.5px;color:var(--muted)}
.rest .clock{display:block;font-size:52px;font-weight:800;color:var(--text);margin:4px 0;letter-spacing:.02em}
.rest .nx{font-size:14px;font-weight:600}
.rest .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rest .row button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.rest .row button.pri{background:var(--btn);border-color:transparent;color:#fff}
.restpill{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;z-index:8;display:flex;gap:4px;align-items:center;padding:4px 6px 4px 12px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(12,12,13,.96);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.restpill .clock{font-size:17px;font-weight:800;color:var(--text);margin-right:6px}
.restpill button{min-height:44px;padding:0 12px;border-radius:12px;background:var(--panel2);font-weight:700;font-size:13px}
.rir{margin-top:14px;border:1px solid var(--line);border-radius:18px;padding:14px}
.rir strong{font-size:15px}.rir p{font-size:12px;color:var(--muted);margin-top:2px}
.rir .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rir .opts button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.insight{margin-top:14px;border-left:4px solid var(--brand);background:rgba(141,94,99,.12);border-radius:4px 14px 14px 4px;padding:14px}
.insight strong{font-size:15px}.insight p{font-size:13px;color:var(--muted);margin-top:4px}
.insight button{margin-top:12px}

/* Dock (proposal C) */
.dock{border-top:1px solid var(--line);background:rgba(15,15,16,.98);padding:10px 16px 16px;box-shadow:0 -12px 30px rgba(0,0,0,.45)}
.dock .logger{margin-top:0;border:0;background:none;padding:0}
.dock .rest{margin-top:0}

/* Sheet */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:82%;overflow-y:auto;overscroll-behavior:contain;background:var(--soft);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:8px 16px 20px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shead strong{font-size:17px}
.sec{margin-top:14px}
.sec h3{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose);margin-bottom:4px}
.sec p,.sec li{font-size:13.5px;color:var(--muted)}
.sec ul{padding-left:18px;display:grid;gap:4px}
.sheetbtn{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:700;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.toast{position:absolute;left:16px;right:16px;bottom:90px;z-index:30;background:#222;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;text-align:center}
.done-screen{padding:40px 16px;text-align:center}
.done-screen .ck{width:56px;height:56px;border-radius:50%;background:var(--brand);display:grid;place-items:center;margin:0 auto;font-size:28px}
.done-screen h2{font-size:24px;margin-top:14px}
.done-screen p{color:var(--muted);margin-top:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="top">
  <h1 id="pt-title">Workout mode · exercise screen</h1>
  <p id="pt-sub">Prototype only. Tap between Current and the 3 proposals. Every button works. Demo values; fitness text is the approved text already in the app.</p>
  <div class="tabs" role="group" aria-label="Version">
    <button class="tab" data-v="cur">Current</button>
    <button class="tab" data-v="A">A · Labelled tools</button>
    <button class="tab" data-v="B">B · Logger first<span class="rec">REC</span></button>
    <button class="tab" data-v="C">C · Thumb dock</button>
    <span style="flex:1"></span>
    <div class="lang big" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="es">ES</button></div>
  </div>
  <p class="pitch" id="pitch" aria-live="polite"></p>
</div>
<div class="stage">
  <div class="phone" id="phone"></div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
const ICON={

const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

  restLbl:'✓ Set {s} logged · Next: {n}',setN:'set {s}',add15:'+15s',skip:'Skip',rest:'Rest',

/* Approved posture tips (catalogue-v2 back-squat; English only until PT translation). */

const TARGET=[[75,15],[80,12],[85,10]], LAST=[[90,8],[90,8],[90,8]];

const PITCH={

};
const NOTES={

 A:['Header: unchanged; chip hint removed (W1); language becomes one round 44 px button at the end of the chip row (shows the other language: ES / EN)','Tools: one row of 4 labelled buttons (icon + word, 52 px tall)','Squeeze: unchanged, tap → sheet','Chips: only the non-default technique (W4), plan note joins it on one line','Logger: header “SET 1 OF 3”, no second target (W5); steppers 44 px','Table: # · Last time · Today (target until done, then ✓)','Rest: the logger box turns into the rest box in place'],

 C:['Header: thin progress bar + Exit / title / Finish; one round ES/EN button ends the chip row','Tools: one text row “Technique · Swap · Notes · Google” under the name','Squeeze + plan note in the scroll area','Logger: pinned dock at the bottom (thumb zone), always visible','Table: in the scroll area, current row highlighted','Rest: the dock becomes the rest timer']
};

let S;
function reset(){S={set:0,done:[],kg:75,reps:15,resting:false,rest:120,rir:false,insight:false,sheet:null,note:false,noteTxt:'',toast:'',finished:false,swapped:true}}
reset();
let V='B', L='en', timer=null;
const t=(k,p={})=>(T[L][k]||k).replace(/\{(\w+)\}/g,(_,x)=>p[x]);
const fmt=n=>L==='es'?String(n).replace('.',','):String(n);
const clock=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

function header(opts){
  const prog=opts.compact?`<span class="prog">${t('day')}<small class="clock">0:16</small></span>`
    :`<strong class="prog">${t('day')} · 1/6</strong><span class="clock">0:16</span>`;
  const chips=[1,2,3,4,5,6].map(n=>(n===5?'<span class="ss" aria-hidden="true"></span>':'')+`<button class="xchip ${n===1?'cur':''}" aria-label="${n}" ${n===1?'aria-current="step"':''}>${n}</button>`).join('');
  const lang=`<div class="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="${L==='en'}">EN</button><button data-l="es" aria-pressed="${L==='es'}">ES</button></div>`;
  let h=`<div class="bar"><div class="barrow"><button class="pill">${t('exit')}</button>${prog}<button class="pill" data-a="finish">${t('finish')}</button></div>`;
  if(opts.seg) h+=`<div class="segbar" aria-hidden="true">${[1,2,3,4,5,6].map(n=>`<i class="${n===1?'c':''}"></i>`).join('')}</div>`;
  if(opts.hint) h+=`<div class="chiprow"><div class="chips">${chips}</div></div><div class="hint"><span>${t('hint')}</span>${lang}</div>`;
  else h+=`<div class="chiprow"><div class="chips">${chips}</div><button class="xchip langone" data-l="${L==='en'?'es':'en'}" aria-label="${L==='en'?'Cambiar a español':'Switch to English'}">${L==='en'?'ES':'EN'}</button></div>`;
  return h+'</div>';
}
function swapLine(small){return S.swapped?`<div class="swapline ${small?'small':''}">${t('instead',{n:t('orig')})}<button data-a="undo">${t('undo')}</button></div>`:''}
function cue(extra){return `<button class="cue" data-a="sheet" aria-haspopup="dialog"><span class="lab">${t('sq')}</span> · ${t('cue')} <span class="more" aria-hidden="true">›</span>${extra?`<small>${t('more')} ›</small>`:''}</button>`}
function stepper(cls){
  return `<div class="fields">
   <div><div class="flab">${t('kg')}</div><div class="step ${cls}"><button data-a="kg-" aria-label="− 2.5 kg">−</button><div class="val num" aria-live="polite">${fmt(S.kg)}</div><button data-a="kg+" aria-label="+ 2.5 kg">+</button></div></div>
   <div><div class="flab">${t('reps')}</div><div class="step ${cls}"><button data-a="r-" aria-label="− 1">−</button><div class="val num">${S.reps}</div><button data-a="r+" aria-label="+ 1">+</button></div></div></div>`;
}
const tw=i=>`${fmt(TARGET[i][0])}×${TARGET[i][1]}`;
const lw=i=>`${fmt(LAST[i][0])}×${LAST[i][1]}`;
const dw=i=>`${fmt(S.done[i][0])}×${S.done[i][1]}`;
function table4(){
  return `<div class="tbl" role="table"><div class="tr th" role="row"><span>#</span><span>${t('last')} ${t('lastDate')}</span><span>${t('target')}</span><span>${t('done')}</span></div>`+
  TARGET.map((_,i)=>`<div class="tr ${i===S.set&&!allDone()?'now':''}" role="row"><span>${i+1}</span><span>${lw(i)}</span><span>${tw(i)}</span><span>${S.done[i]?dw(i)+' ✓':'—'}</span></div>`).join('')+'</div>';
}
function table3(){
  return `<div class="tbl tbl3" role="table"><div class="tr th" role="row"><span>#</span><span>${t('last')} · ${t('lastDate')}</span><span>${t('today')}</span></div>`+
  TARGET.map((_,i)=>`<div class="tr ${i===S.set&&!allDone()?'now':''} ${S.done[i]?'ok':''}" role="row"><span>${i+1}</span><span class="dim">${lw(i)}</span><span>${S.done[i]?dw(i)+' ✓':tw(i)}</span></div>`).join('')+'</div>';
}
const allDone=()=>S.done.length===3;
function restBox(){
  const next=S.set<3?`${t('setN',{s:S.set+1})} · ${tw(S.set)}`:'';
  return `<section class="rest" role="timer" aria-live="off"><div class="lbl">${t('restLbl',{s:S.set,n:next})}</div><span class="clock">${clock(S.rest)}</span>
   <div class="row"><button data-a="add15">${t('add15')}</button><button class="pri" data-a="skip">${t('skip')}</button></div></section>`;
}
function rirBox(){return `<section class="rir"><strong>${t('rirQ')}</strong><p>${t('rirH')}</p><div class="opts"><button data-a="rir">${t('rir0')}</button><button data-a="rir">${t('rir1')}</button><button data-a="rir">${t('rir3')}</button></div></section>`}
function insightBox(){return `<section class="insight" role="status"><strong>● ${t('base')}</strong><p>${t('baseLine',{d:'Legs B'})}</p><button class="logbtn" data-a="cont">${t('cont')}</button></section>`}
function loggerBody(head){
  if(S.rir) return rirBox();
  if(S.insight) return insightBox();
  if(S.resting && !allDone()) return restBox();
  return `<section class="logger">${head}${stepper(V==='cur'?'cur':'')}<button class="logbtn" data-a="log">${t('log',{s:S.set+1})}</button></section>`;
}
function noteArea(){return S.note?`<textarea aria-label="${t('notes')}" placeholder="${t('notePh')}">${S.noteTxt}</textarea>`:''}

/* ---------- Variants ---------- */
function vCur(){
  const head=`<p class="lhead"><strong>${t('cur',{s:S.set+1,t:3,w:fmt(TARGET[S.set]?.[0]??85),r:TARGET[S.set]?.[1]??10})}</strong></p>`;
  const body=`<div class="card"><div class="namerow"><span class="name light">${t('name')}</span><button class="round" aria-label="Collapse">−</button></div>${swapLine(true)}
   <div class="icons">${['google','swap','notes','technique'].map(k=>`<button class="ico" data-a="${k}" aria-label="${t({google:'google',swap:'swap',notes:'notes',technique:'tech'}[k])}">${svg(k)}</button>`).join('')}</div>
   ${noteArea()}${cue(false)}
   <div class="tags"><span class="tag">${t('pyr')}</span><span class="tag">${t('quads')}</span><span class="tag sub">${t('glutes')}</span></div>
   <p class="plan">${t('plan')}</p>
   ${S.rir||S.insight?loggerBody(''):`<section class="logger">${head}${stepper('cur')}<button class="logbtn" data-a="log">${t('log',{s:Math.min(S.set+1,3)})}</button></section>`}
   ${table4()}</div>`;
  const pill=S.resting?`<div class="restpill" role="timer"><span class="clock">⏱ ${clock(S.rest)}</span><button data-a="add15">${t('add15')}</button><button data-a="skip">${t('skip')}</button></div>`:'';
  return {top:header({hint:true}),body,pill};
}
function vA(){
  const head=`<div class="lhead"><strong>${t('setOf',{s:S.set+1,t:3})}</strong></div>`;
  const tools=[['technique','tech'],['swap','swap'],['notes','notes'],['google','gshort']].map(([k,l])=>`<button class="seg" data-a="${k}">${svg(k)}<span>${t(l)}</span></button>`).join('');
  const body=`<div class="card"><div class="namerow"><span class="name">${t('name')}</span></div>${swapLine()}
   <div class="segs" role="group" aria-label="${t('tools')}">${tools}</div>${noteArea()}
   ${cue(false)}
   <p class="plan"><b>${t('pyr')}</b>${t('plan')}</p>
   ${loggerBody(head)}${table3()}</div>`;
  return {top:header({}),body};
}
function vB(){
  const head=`<div class="lhead"><strong>${t('setOf',{s:S.set+1,t:3})}</strong><span>${t('pyr')}</span></div><p class="lsub">${t('plan')}</p>`;
  const body=`<div class="card"><div class="namerow"><span class="name">${t('name')}</span>
     <button class="textbtn" data-a="swap">${svg('swap')}${t('swap')}</button></div>${swapLine()}
   ${cue(true)}
   ${loggerBody(head)}${table3()}
   <div class="addnote"><button class="link" data-a="notes">${svg('notes')}${S.note?t('notes'):t('addNote')}</button>${noteArea()}</div></div>`;
  return {top:header({compact:true}),body};
}
function vC(){
  const head=`<div class="lhead"><strong>${t('setOf',{s:S.set+1,t:3})}</strong><span>${t('pyr')}</span></div>`;
  const links=[['technique','tech'],['swap','swap'],['notes','notes'],['google','gshort']].map(([k,l])=>`<button class="link" data-a="${k}">${t(l)}</button>`).join('<span aria-hidden="true" style="color:var(--dim);align-self:center">·</span>');
  const body=`<div class="card"><div class="namerow"><span class="name">${t('name')}</span></div>${swapLine()}
   <div class="links" role="group" aria-label="${t('tools')}">${links}</div>${noteArea()}
   ${cue(false)}<p class="plan">${t('plan')}</p>${table3()}</div>`;
  const dock=`<div class="dock">${loggerBody(head)}</div>`;
  return {top:header({compact:true,seg:true}),body,dock};
}

function sheet(){
  if(S.sheet!=='cue') return '';
  const gBtn=(V==='B')?`<button class="sheetbtn" data-a="google">${svg('google')}${t('google')}</button>`:'';
  return `<div class="backdrop" data-a="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${t('name')}" onclick="event.stopPropagation()">
   <div class="grab"></div><div class="shead"><strong>${t('name')}</strong><button class="pill" data-a="close">${t('close')}</button></div>
   <div class="sec"><h3>${t('sheetToday')}</h3><p>${t('todayT',{sets:3,reps:'15–10',w:'75 / 80 / 85'})}</p></div>
   <div class="sec"><h3>${t('sheetLast')}</h3><p>${t('lastDate')} · 90×8 · 90×8 · 90×8</p></div>
   <div class="sec"><h3>${t('fullCue')}</h3><p>${t('fullCueTxt')}</p></div>
   <div class="sec"><h3>${t('posture')}</h3><ul>${TIPS.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div class="sec"><h3>${t('planNotes')}</h3><p>${t('plan')}</p></div>${gBtn}</div></div>`;
}

function render(){
  document.documentElement.lang=L;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===V));
  document.querySelectorAll('.top .lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  document.getElementById('pitch').innerHTML=PITCH[L][V];
  document.getElementById('notes').innerHTML=`<h2>${V==='cur'?'Current':'Proposal '+V}</h2><ul>${NOTES[V].map(n=>`<li>${n}</li>`).join('')}</ul><button class="reset" data-a="reset">Reset demo</button>`;
  const ph=document.getElementById('phone');
  const keepScroll=ph.querySelector('.scroll')?.scrollTop||0;
  if(S.finished){ph.innerHTML=`<div class="scroll"><div class="done-screen"><div class="ck">✓</div><h2>${t('completed')}</h2><p>${t('day')}</p><button class="logbtn" data-a="reset">${t('back')}</button></div></div>`;bind();return}
  const r={cur:vCur,A:vA,B:vB,C:vC}[V]();
  ph.innerHTML=`<div class="scroll">${r.top}<div class="wrap">${r.body}</div></div>${r.dock||''}${r.pill||''}${sheet()}${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}`;
  ph.querySelector('.scroll').scrollTop=keepScroll;
  bind();
}
function startRest(){clearInterval(timer);S.rest=120;S.resting=true;timer=setInterval(()=>{S.rest=Math.max(0,S.rest-1);if(S.rest===0){clearInterval(timer);S.resting=false;render();return}
  document.querySelectorAll('#phone .rest .clock').forEach(c=>c.textContent=clock(S.rest));
  document.querySelectorAll('#phone .restpill .clock').forEach(c=>c.textContent='⏱ '+clock(S.rest))},1000)}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},2200)}
function act(a){
  switch(a){
   case 'kg+':S.kg+=2.5;break; case 'kg-':S.kg=Math.max(0,S.kg-2.5);break;
   case 'r+':S.reps++;break; case 'r-':S.reps=Math.max(1,S.reps-1);break;
   case 'log':
     if(allDone()) return;
     S.done[S.set]=[S.kg,S.reps];S.set++;
     if(S.set<3){S.kg=TARGET[S.set][0];S.reps=TARGET[S.set][1];startRest()}
     else{clearInterval(timer);S.resting=false;S.rir=true}
     break;
   case 'add15':S.rest+=15;break;
   case 'skip':clearInterval(timer);S.resting=false;break;
   case 'rir':S.rir=false;S.insight=true;break;
   case 'cont':S.finished=true;break;
   case 'finish':S.finished=true;break;
   case 'undo':S.swapped=false;break;
   case 'sheet':case 'technique':S.sheet='cue';break;
   case 'close':S.sheet=null;break;
   case 'notes':S.note=!S.note;break;
   case 'google':toast(t('googleToast'));return;
   case 'swap':toast(t('swapToast'));return;
   case 'reset':clearInterval(timer);reset();break;
  }
  render();
}
function bind(){
  document.querySelectorAll('[data-a]').forEach(el=>el.onclick=e=>{if(el.classList.contains('backdrop')&&e.target!==el)return;e.stopPropagation();act(el.dataset.a)});
  document.querySelectorAll('[data-l]').forEach(el=>el.onclick=()=>{L=el.dataset.l;render()});
  const ta=document.querySelector('#phone textarea');if(ta)ta.oninput=e=>S.noteTxt=e.target.value;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{V=b.dataset.v;clearInterval(timer);reset();render()});
render();
</script>
</body>
</html>
