<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effortless Logging</title>
<style>
/* Prototype only. Single dark look on purpose: it mirrors the GymStudio app. Type follows the compact scale in 2026-10-18-typography-system.md. */
:root {
  color-scheme: dark;
  --page: #050506; --bg: #0f0f10; --card: #18181a; --panel: rgba(255,255,255,.05); --panel2: rgba(255,255,255,.09);
  --line: rgba(255,255,255,.11); --text: #f3f3f1; --muted: #c8c7c4; --dim: #93918e;
  --rose: #c99ca1; --brand: #8d5e63; --rose-wash: rgba(141,94,99,.18); --btn: linear-gradient(120deg,#8d5e63,#6c4a4e);
  --ok: #a5dcae; --ok-wash: rgba(165,220,174,.14); --amber: #e5c07b;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--page); color: var(--text); font: 400 15px/20px var(--font); padding: 16px; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; background: none; border: 0; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.num, .tab { font-variant-numeric: tabular-nums; }

/* page */
.page-head { max-width: 1120px; margin: 0 auto 12px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.page-head p { color: var(--muted); font-size: 13px; line-height: 18px; max-width: 62ch; margin-top: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; flex-wrap: wrap; }
.seg button { min-height: 44px; padding: 0 12px; color: var(--muted); font-size: 13px; font-weight: 600; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--rose-wash); color: var(--text); }
.layout { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0,1fr) 390px minmax(0,1fr); gap: 16px; align-items: start; }
.side { display: grid; gap: 12px; min-width: 0; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; }
.box h2 { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--rose); margin-bottom: 6px; }
.box p, .box li { font-size: 13px; line-height: 18px; color: var(--muted); }
.box ul { padding-left: 16px; }
.box .seg { display: flex; }
.box .seg button { flex: 1 1 auto; }
.ctl { display: grid; gap: 8px; }
.ctl label { font-size: 13px; color: var(--dim); }
.ghost { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.count { display: flex; gap: 12px; }
.count div { flex: 1; text-align: center; background: var(--panel); border-radius: 12px; padding: 8px 4px; }
.count b { display: block; font-size: 28px; line-height: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.count span { font-size: 11px; line-height: 14px; color: var(--muted); }
table.score { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; font-variant-numeric: tabular-nums; }
table.score th { color: var(--dim); font-weight: 600; text-align: left; padding: 4px; }
table.score td { padding: 6px 4px; border-top: 1px solid var(--line); color: var(--muted); }
table.score tr.on td { color: var(--text); font-weight: 600; }
table.score .exp { color: var(--dim); font-weight: 400; }

/* phone */
.phone { width: 100%; max-width: 390px; height: 760px; margin: 0 auto; background: var(--bg); border: 1px solid var(--line); border-radius: 28px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.phone.shake { animation: shake .45s; }
@keyframes shake { 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }
@media (prefers-reduced-motion: reduce) { .phone.shake { animation: none; } .bar i { transition: none !important; } }
.top { flex: none; padding: 8px 12px 8px; background: rgba(15,15,16,.97); border-bottom: 1px solid var(--line); }
.topline { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.topline .ttl { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.topline .elapsed { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tb { min-height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; font-weight: 600; background: var(--panel); white-space: nowrap; }
.chips { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.chip { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.chip.cur { border-color: var(--rose); background: var(--rose-wash); color: var(--rose); }
.chip.done { background: var(--ok); border-color: var(--ok); color: #123; }
.pair { display: inline-flex; align-items: center; gap: 2px; padding: 0 2px; border: 1px dashed rgba(201,156,161,.5); border-radius: 15px; height: 50px; }
.pair svg { width: 16px; height: 16px; color: var(--rose); flex: none; }
.chipnote { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; line-height: 16px; }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 12px 12px 88px; display: grid; grid-template-columns: minmax(0,1fr); gap: 12px; align-content: start; }
.screen > *, .xcard > *, .ins-card > * { min-width: 0; }

/* card */
.xcard { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: minmax(0,1fr); gap: 12px; min-width: 0; }
.xcard.current { border-color: rgba(201,156,161,.5); }
.name { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.name small { display: block; font-size: 13px; line-height: 18px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.link { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--muted); }
.link svg { width: 16px; height: 16px; color: var(--rose); flex: none; }
.link b { font-weight: 600; color: var(--text); }
.tools { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
.tool { min-height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11px; line-height: 14px; font-weight: 600; color: var(--muted); }
.tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.cue { display: grid; grid-template-columns: 40px minmax(0,1fr) 24px; align-items: center; gap: 12px; background: var(--rose-wash); border: 1px solid rgba(201,156,161,.25); border-radius: 14px; padding: 10px 12px; font-size: 15px; line-height: 20px; font-weight: 600; text-align: left; min-height: 60px; width: 100%; }
.cue .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--panel2); display: grid; place-items: center; }
.cue svg { width: 22px; height: 22px; fill: none; stroke: var(--rose); stroke-width: 1.7; }
.cue .chev { color: var(--rose); font-size: 18px; }
.plan-note { font-size: 13px; line-height: 18px; color: var(--muted); }
.plan-note b { font-weight: 600; color: var(--text); }
.logger { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; }
.setlabel { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.setlabel span { font-size: 13px; font-weight: 400; color: var(--muted); }
.field { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; }
.field > span { font-size: 13px; color: var(--muted); }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 6px; }
.stepper button { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 20px; font-weight: 600; }
.stepper output { height: 48px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.primary { width: 100%; min-height: 56px; border-radius: 14px; background: var(--btn); color: #fff; font-size: 15px; font-weight: 600; padding: 0 12px; font-variant-numeric: tabular-nums; }
.primary.big { min-height: 64px; font-size: 17px; }
.secondary { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; font-weight: 600; }
.hint { font-size: 13px; line-height: 18px; color: var(--muted); }
.logged-note { font-size: 13px; line-height: 18px; color: var(--ok); }

/* table + trend (stay on every card) */
.sect-cap { font-size: 13px; line-height: 18px; color: var(--muted); }
.stable { display: grid; gap: 4px; }
.shead, .srow { display: grid; grid-template-columns: 28px 1fr 1fr; align-items: center; padding: 0 12px; }
.shead { font-size: 13px; line-height: 18px; color: var(--dim); }
.srow { min-height: 44px; border-radius: 12px; width: 100%; text-align: left; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--muted); }
.srow.cur { background: var(--rose-wash); color: var(--text); box-shadow: inset 2px 0 0 var(--rose); }
.srow .today { color: var(--text); font-weight: 600; }
.srow .check { color: var(--ok); margin-left: 6px; }
.editrow { padding: 8px 12px 12px; display: grid; gap: 8px; background: var(--panel); border-radius: 12px; }
.editrow .hint { display: flex; justify-content: space-between; align-items: center; }
.textbtn { min-height: 44px; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--rose); }
details.trend { border-top: 1px solid var(--line); padding-top: 4px; }
details.trend summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; cursor: pointer; list-style: none; }
details.trend summary::-webkit-details-marker { display: none; }
details.trend summary::after { content: "▾"; color: var(--muted); }
details.trend:not([open]) summary::after { content: "▸"; }
.trend-scroll { overflow-x: auto; }
.trend-legend { display: flex; gap: 12px; font-size: 11px; line-height: 14px; color: var(--muted); margin-top: 4px; }
.trend-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.trend-cap { font-size: 11px; line-height: 14px; color: var(--dim); margin-top: 4px; }
svg.tr text { fill: var(--muted); font-size: 10px; font-family: var(--font); }
svg.tr text.w { font-weight: 700; fill: var(--text); }
svg.tr text.d { fill: var(--dim); }
svg.tr line { stroke: var(--line); }
svg.tr rect.today { fill: rgba(201,156,161,.06); stroke: rgba(201,156,161,.5); stroke-dasharray: 4 3; }

/* concept 2 list */
.clist { display: grid; gap: 4px; }
.chead, .crow { display: grid; grid-template-columns: 24px 60px 1fr 1fr 48px; gap: 4px; align-items: center; }
.chead { font-size: 13px; color: var(--dim); padding: 0 8px; }
.crow { border-radius: 12px; padding: 4px 8px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--muted); }
.crow.cur { background: var(--rose-wash); color: var(--text); }
.crow.done { color: var(--dim); }
.cval { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; font-weight: 600; font-size: 15px; background: var(--panel); font-variant-numeric: tabular-nums; }
.tick { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); font-size: 18px; font-weight: 700; background: var(--panel); }
.crow.cur .tick { background: var(--btn); border-color: transparent; color: #fff; }
.crow.done .tick { background: var(--ok); border-color: var(--ok); color: #123; }

/* concept 3 */
.ask { display: grid; gap: 8px; text-align: left; }
.ask .q { font-size: 15px; color: var(--muted); }
.ask .v { font-size: 20px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

/* 10 s switch strip: deliberately not a rest */
.switch { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 8px; align-items: center; border: 1px dashed rgba(201,156,161,.55); border-radius: 12px; padding: 4px 4px 4px 10px; font-size: 13px; line-height: 18px; color: var(--text); min-height: 52px; }
.switch svg { width: 18px; height: 18px; color: var(--rose); }
.switch b { font-weight: 600; font-variant-numeric: tabular-nums; }
.ribbon { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--rose-wash); border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 18px; font-weight: 600; }
.ribbon .steps { display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--muted); }
.ribbon .steps b { color: var(--rose); font-weight: 700; }

/* combined */
.combo { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.combo h3 { font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.badge { display: inline-block; font-size: 11px; line-height: 14px; font-weight: 600; color: var(--rose); border: 1px solid rgba(201,156,161,.4); border-radius: 6px; padding: 2px 4px; margin-right: 6px; vertical-align: 2px; }
.mini-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini-fields span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.mini { display: grid; grid-template-columns: 44px 1fr 44px; }
.mini button { height: 44px; border: 1px solid var(--line); background: var(--panel2); font-size: 17px; font-weight: 600; border-radius: 10px; }
.mini output { display: grid; place-items: center; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.round-line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 18px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.round-line.fut { border-style: dashed; color: var(--dim); }

/* current app replica */
.cur-today .logger { background: rgba(255,255,255,.04); }
.logbtn { min-height: 56px; border-radius: 12px; background: var(--btn); font-size: 15px; font-weight: 600; width: 100%; }
.restbox { background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; }
.restbox strong { font-size: 15px; line-height: 20px; font-weight: 600; }
.restbox .acts { display: flex; gap: 6px; align-items: center; }
.restbox .acts .t { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 56px; }
.restbox .acts button { min-height: 44px; padding: 0 10px; border-radius: 10px; background: var(--panel2); font-size: 13px; font-weight: 600; }
.insight { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 13px; line-height: 18px; color: var(--muted); display: grid; gap: 6px; }
.insight b { font-weight: 600; color: var(--text); font-size: 15px; }
.rirbox { display: grid; gap: 6px; font-size: 13px; line-height: 18px; color: var(--muted); }
.rirbox .q { font-weight: 600; color: var(--text); font-size: 15px; }
.rirbtns { display: flex; gap: 6px; }
.rirbtns button { flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; font-weight: 600; font-size: 13px; background: var(--panel); font-variant-numeric: tabular-nums; }
.todaybar { display: flex; gap: 8px; }
.today-sup-ex { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.today-sup-ex h3 { font-size: 13px; font-weight: 600; line-height: 18px; }
.sup-fields { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 4px; align-items: end; }

/* rest pop-up */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.62); display: flex; align-items: flex-end; padding: 12px; z-index: 20; }
.rest { width: 100%; background: #1e1d1f; border: 1px solid rgba(201,156,161,.45); border-radius: 24px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 16px 48px rgba(0,0,0,.6); max-height: calc(100% - 8px); overflow-y: auto; }
.rest-top { display: flex; align-items: center; justify-content: space-between; }
.rest-top h2 { font-size: 17px; line-height: 22px; font-weight: 600; display: flex; align-items: center; gap: 6px; color: var(--rose); }
.rest-top svg { width: 18px; height: 18px; }
.hidebtn { min-height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.clock { font-size: 68px; line-height: 72px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bar { height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--rose); transition: width .2s linear; }
.loggedline { font-size: 13px; line-height: 18px; color: var(--ok); text-align: center; font-variant-numeric: tabular-nums; }
.nextbox { background: var(--panel); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; }
.nextbox span { font-size: 13px; line-height: 18px; color: var(--muted); }
.nextbox b { font-size: 17px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rest-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.go .clock { color: var(--ok); }
.go { border-color: var(--ok); }
.alertchip { font-size: 11px; line-height: 14px; color: #123; background: var(--ok); border-radius: 6px; padding: 2px 6px; font-weight: 600; justify-self: center; }
.inline-ins { font-size: 13px; line-height: 18px; color: var(--muted); }
.inline-ins b { color: var(--text); font-weight: 600; }
.minibar { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 15; display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 8px; min-height: 60px; padding: 8px 12px; border-radius: 16px; background: #2a2527; border: 1px solid var(--rose); width: calc(100% - 24px); text-align: left; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.minibar .t { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.minibar .m { font-size: 13px; line-height: 16px; color: var(--muted); min-width: 0; font-variant-numeric: tabular-nums; }
.minibar .o { font-size: 13px; font-weight: 600; color: var(--rose); }
.minibar.go { border-color: var(--ok); }
.minibar.go .t { color: var(--ok); }
.toast { position: absolute; left: 12px; right: 12px; bottom: 84px; z-index: 30; background: #2b2b2e; border: 1px solid var(--line); border-radius: 14px; padding: 4px 4px 4px 12px; font-size: 13px; line-height: 18px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.toast button { min-height: 44px; padding: 0 10px; font-weight: 600; color: var(--rose); }
.confirm { position: absolute; inset: 0; background: rgba(0,0,0,.62); display: flex; align-items: center; padding: 16px; z-index: 40; }
.confirm > div { width: 100%; background: #1e1d1f; border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 8px; }
.confirm p { font-size: 17px; line-height: 22px; font-weight: 600; text-wrap: balance; }

/* completed */
.done-head { text-align: center; display: grid; gap: 4px; padding-top: 8px; }
.done-head h2 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -.02em; }
.done-head p { font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.stats div { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
.stats b { display: block; font-size: 20px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--muted); }
.ins-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; grid-template-columns: minmax(0,1fr); gap: 6px; }
.ins-card h3 { font-size: 17px; line-height: 22px; font-weight: 600; text-wrap: balance; }
.ins-card p { font-size: 13px; line-height: 18px; color: var(--muted); }

/* lock screen preview */
.lock { background: #0a0a0b; border-radius: 16px; padding: 12px; display: grid; gap: 8px; border: 1px solid var(--line); }
.la { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 8px; align-items: center; background: rgba(0,0,0,.88); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.la svg { width: 22px; height: 22px; color: var(--rose); }
.la small { display: block; font-size: 11px; line-height: 14px; color: var(--muted); }
.la strong { display: block; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.la .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }

  const exb = (ex, i) => {
    const e = EXS[ex], l = e.last[r];
    return `<div class="today-sup-ex"><p class="link" style="font-size:15px;font-weight:600;color:var(--text)"><span class="badge">${e.code}</span>${fullName(e)}</p>
      <p class="sect-cap">${T().last}: ${fmt(l[0])}×${l[1]} · ${L(e.lastDate)}</p>${cue(e)}
      <p class="plan-note"><b>${T().superset}</b></p>
      <div class="sup-fields">${stepper(ex, r, 'w', true)}${stepper(ex, r, 'r', true)}<button class="tick" style="${tt.t[i] ? 'background:var(--ok);color:#123' : ''}" data-a="tick" data-i="${i}" aria-pressed="${tt.t[i]}" aria-label="C${i + 1}">✓</button></div>
      ${tt.handoff && i === 0 ? `<p class="logged-note" id="handoff">${T().handoff('C2', Math.ceil(tt.handoff.left))}</p>` : ''}
      ${tools()}<button class="secondary" data-a="demo" data-nc="1">${T().notes}</button>${trend(ex, e.code)}</div>`;
  };
  return `<article class="xcard current cur-today">${head}${r > 0 ? others[0] : ''}<p class="setlabel">${T().roundOf(r + 1, 3)}</p>${exb(1, 0)}${exb(2, 1)}${(r === 0 ? others : others.slice(1)).join('')}</article>`;
}
function completed() {
  const total = S.vals.flat().filter(v => v.done).length;
  const cards = EXS.map((e, i) => {
    const d = S.vals[i].filter(v => v.done);
    if (!d.length) return '';
    return `<div class="ins-card"><h3>${L(e.name)}</h3><p>${i === 0 ? `<b>${T().mixed}</b> · ${T().mixedL}` : `<b>${T().improved}</b> · ${T().setDelta(i === 1 ? 2 : fmt(1.5))}`}</p>
      ${trend(i)}</div>`;
  }).join('');
  return `<div class="done-head"><h2>${S.early ? T().earlyTitle(countDone(), 3) : T().completed}</h2><p>${T().day}</p></div>
    <div class="stats"><div><b class="num">${Math.max(1, Math.round(S.elapsed / 60))} min</b><span>${T().duration}</span></div><div><b class="num">${total}/9</b><span>${T().sets}</span></div><div><b class="num">${countDone()}/3</b><span>${T().exs}</span></div></div>
    <h3 style="font-size:17px;line-height:22px;font-weight:600">${T().insights}</h3>${cards}
    <button class="primary" data-a="restart" data-nc="1">${T().back}</button>`;
}

/* ---------- render ---------- */
let screenEl = null;
function render() {
  const ph = document.getElementById('phone');
  const prevTop = screenEl ? screenEl.scrollTop : 0;
  let main = '';
  if (S.done) main = completed();
  else if (isToday()) main = S.view === 0 ? todaySingle(0) : todaySuperset();
  else if (combined() && S.view > 0) main = combinedCard();
  else main = exerciseCard(S.view);
  const over = [];
  if (!isToday() && S.rest && !S.done) over.push(restPopup());
  if (S.toast && S.toast.kind === 'undo' && S.done) over.push(`<div class="toast" role="status"><span>${T().undoLast}</span><button data-a="undo" data-nc="1">${T().undo}</button></div>`);
  if (S.toast && S.toast.kind === 'msg') over.push(`<div class="toast" role="status"><span>${S.toast.text}</span></div>`);
  if (S.confirm) over.push(`<div class="confirm"><div><p>${T().finishQ(countDone(), 3)}</p><button class="secondary" data-a="confirmno" data-nc="1">${T().keep}</button><button class="primary" data-a="confirmyes" data-nc="1">${T().finishNow}</button></div></div>`);
  ph.innerHTML = (S.done ? '' : topBar()) + `<div class="screen" id="screen">${main}</div>` + over.join('');
  screenEl = document.getElementById('screen');
  screenEl.scrollTop = S._top0 ? 0 : prevTop; S._top0 = false;
  screenEl.addEventListener('wheel', onScroll, { passive: true });
  screenEl.addEventListener('touchmove', onScroll, { passive: true });
  ph.querySelectorAll('.trend-scroll').forEach(x => x.scrollLeft = x.scrollWidth);
  ph.querySelectorAll('details[data-trend]').forEach(d => d.addEventListener('toggle', () => { ui.trendOpen = d.open; }));
  renderSide();
}
function scrollTop() { S._top0 = true; }
let scrollTimer = null, scrolling = false;
function onScroll() {
  if (!scrolling) { scrolling = true; S.scrolls++; document.getElementById('tScr').textContent = S.scrolls; }
  clearTimeout(scrollTimer); scrollTimer = setTimeout(() => scrolling = false, 350);
}

function renderSide() {
  const t = T();
  document.documentElement.lang = ui.lang;
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('pageSub').textContent = t.sub;
  document.getElementById('lblDesign').textContent = t.design;
  document.getElementById('lblSup').textContent = t.supLabel;
  document.getElementById('lblDemo').textContent = t.demo;
  document.getElementById('restart').textContent = t.restart;
  document.getElementById('jump').textContent = t.jump;
  document.getElementById('closeApp').textContent = t.closeApp;
  document.getElementById('lblTaps').textContent = t.taps;
  document.getElementById('tExL').textContent = t.tEx;
  document.getElementById('tSupL').textContent = t.tSup;
  document.getElementById('tScrL').textContent = t.tScr;
  document.getElementById('tapNote').textContent = t.tapNote;
  document.getElementById('lblLock').textContent = t.lock;
  document.getElementById('lockNote').textContent = isToday() ? t.lockNoteNow : t.lockNoteNew;
  document.getElementById('supNote').textContent = isToday() ? t.supToday : t.supNote[ui.sup];
  document.getElementById('tabs').innerHTML = t.tabs.map((x, i) => `<button data-tab="${i}" aria-pressed="${ui.tab === i}">${x}</button>`).join('');
  document.getElementById('supOpts').innerHTML = t.sup.map((x, i) => `<button data-sup="${i}" aria-pressed="${!isToday() && ui.sup === i}" ${isToday() ? 'disabled style="opacity:.45"' : ''}>${x}</button>`).join('');
  document.getElementById('speed').innerHTML = t.speed.map((x, i) => `<button data-speed="${i ? 1 : 10}" aria-pressed="${ui.speed === (i ? 1 : 10)}">${x}</button>`).join('');
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === ui.lang));
  document.getElementById('tEx').textContent = S.taps.ex;
  document.getElementById('tSup').textContent = S.taps.sup;
  document.getElementById('tScr').textContent = S.scrolls;
  renderScore(); renderLock();
}
function renderScore() {
  const t = T();
  const rows = [
    { k: 't', n: t.tabs[0], ex: 3, sup: '6', scr: '3+' },
    { k: `1-${ui.sup}`, n: t.tabs[1], ex: 3, sup: ui.sup === 2 ? '3' : '6', scr: '0' },
    { k: `2-${ui.sup}`, n: t.tabs[2], ex: 3, sup: ui.sup === 2 ? '3' : '6', scr: '0' },
    { k: `3-${ui.sup}`, n: t.tabs[3], ex: 3, sup: ui.sup === 2 ? '3' : '6', scr: '0' },
  ];
  const c = (val, exp) => val === undefined ? `<span class="exp">${exp}</span>` : val;
  document.getElementById('scoreBox').innerHTML = `<h2>${t.score}</h2><table class="score"><thead><tr><th>${t.mode}</th><th>${t.ex}</th><th>${t.ssup}</th><th>↕</th></tr></thead><tbody>${rows.map(r => {
    const run = runs[r.k] || {};
    return `<tr class="${runKey() === r.k ? 'on' : ''}"><td>${r.n}</td><td>${c(run.ex, r.ex)}</td><td>${c(run.sup, r.sup)}</td><td>${c(run.scr, r.scr)}</td></tr>`;
  }).join('')}</tbody></table><p class="hint" style="margin-top:8px">${t.expected}</p>`;
}
function lockState() {
  const R = S.rest, t = T();
  if (S.done) return null;
  if (!R) return null;
  if (isToday()) return { head: t.rest === 'Descanso' ? 'Rest' : 'Rest', sub: S.view === 0 ? fullName(EXS[0]) : `${fullName(EXS[1])} + ${fullName(EXS[2])}`, time: R.over ? 'Go' : clock(R.left) };
  const c = R.ctx;
  const nextText = c.next.round !== undefined ? `C1 ${pair(c.next.a)} · C2 ${pair(c.next.b)}` : (c.nextEx ? `${c.nextEx} · ` : '') + `${fmt(c.next.w)} kg × ${c.next.r}`;
  return { head: t.rest, sub: `${t.next}: ${nextText}`, time: R.over ? t.go : clock(R.left) };
}
function renderLock() {
  const L0 = lockState(), box = document.getElementById('lock');
  if (!L0) { box.innerHTML = `<p class="quiet">${!isToday() && S.sw ? T().lockSwitch : T().lockIdle}</p>`; return; }
  box.innerHTML = `<div class="la">${TIMER}<div style="min-width:0"><small>${L0.head}</small><strong>${L0.sub}</strong></div><span class="big" data-lock-time>${L0.time}</span></div>
    <div class="di">${TIMER}<span data-lock-time>${L0.time}</span></div>`;
}

/* ---------- ticking ---------- */
let lastTick = Date.now();
function tick() {
  const now = Date.now(), dt = (now - lastTick) / 1000; lastTick = now;
  if (!S || S.done) { if (S && S.toast && S.toast.kind === 'undo') { S.toast.left -= dt; if (S.toast.left <= 0) { S.toast = null; render(); } } return; }
  S.elapsed += dt;
  document.querySelectorAll('[data-elapsed]').forEach(x => x.textContent = clock(S.elapsed));
  const sp = ui.speed;
  if (S.rest) {
    const R = S.rest;
    if (!R.over) {
      R.left -= dt * sp;
      document.querySelectorAll('[data-rest-clock]').forEach(x => x.textContent = (R.inplace ? '⏱ ' : '') + clock(R.left));
      document.querySelectorAll('[data-rest-bar]').forEach(x => x.style.width = Math.max(0, R.left / R.total * 100) + '%');
      document.querySelectorAll('[data-lock-time]').forEach(x => x.textContent = clock(R.left));
      if (R.left <= 0) {
        if (R.inplace) { R.over = true; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} render(); }
        else restEnded();
      }
    } else {
      R.overLeft -= dt;
      if (R.overLeft <= 0) closeRest();
    }
  }
  if (S.sw) {
    S.sw.left -= dt * Math.max(1, sp / 2);
    const el = document.getElementById('swText');
    if (S.sw.left <= 0) { const code = S.sw.code; S.sw = null; const box = document.querySelector('[data-switch]'); if (box) box.remove(); }
    else if (el) el.innerHTML = T().switchTo(S.sw.code, Math.ceil(S.sw.left));
  }
  if (S.tt.handoff) {
    S.tt.handoff.left -= dt * Math.max(1, sp / 2);
    const el = document.getElementById('handoff');
    if (S.tt.handoff.left <= 0) { S.tt.handoff = null; if (el) el.remove(); }
    else if (el) el.textContent = T().handoff('C2', Math.ceil(S.tt.handoff.left));
  }
  if (S.insight && !S.insightPin) {
    S.insight.left -= dt;
    if (S.insight.left <= 0) leaveInsight();
  }
  if (S.toast && S.toast.kind === 'msg') { S.toast.left -= dt; if (S.toast.left <= 0) { S.toast = null; render(); } }
}
setInterval(tick, 200);

/* ---------- events ---------- */
document.getElementById('phone').addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  // Taps inside the rest card must not count as a tap on the scrim behind it.
  if (b.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  const a = b.dataset.a, ex = +b.dataset.ex, set = +b.dataset.set;
  if (b.tagName === 'BUTTON' && b.dataset.nc !== '1') {
    const phase = (S.view === 0 && !S.done) ? 'ex' : 'sup';
    if (S.done) { /* post-flow taps are not counted */ }
    else if (phase === 'ex' && S.taps.ex !== '–') S.taps.ex++;
    else if (phase === 'sup') S.taps.sup++;
  }
  switch (a) {
    case 'log': logProposed(ex, set); break;
    case 'logRound': logRoundCombined(set); break;
    case 'todaylog': todayLog(ex, set); break;
    case 'logall': todayLogExercise(ex); break;
    case 'tick': todayTick(+b.dataset.i); break;
    case 'step': stepVal(ex, set, b.dataset.f, +b.dataset.d); break;
    case 'pickset': S.cur = { ex, set }; render(); break;
    case 'edit': if (S.vals[ex][set].done) { S.edit = S.edit && S.edit.ex === ex && S.edit.set === set ? null : { ex, set }; render(); } break;
    case 'editclose': S.edit = null; render(); break;
    case 'fixopen': S.fix = ex; S.edit = null; render(); break;
    case 'fixclose': S.fix = null; S.edit = null; render(); break;
    case 'listedit': S.listEdit = S.listEdit && S.listEdit.ex === ex && S.listEdit.set === set ? null : { ex, set }; render(); break;
    case 'listclose': S.listEdit = null; render(); break;
    case 'askedit': S.askEdit = true; render(); break;
    case 'undo': doUndo(); break;
    case 'resthide': S.rest.hidden = true; render(); break;
    case 'restshow': S.rest.hidden = false; render(); break;
    case 'restclose': closeRest(); break;
    case 'restskip': S.rest = null; render(); break;
    case 'plus15': S.rest.left += 15; S.rest.total = Math.max(S.rest.total, S.rest.left); render(); break;
    case 'rir': S.rir[ex] = +b.dataset.v; render(); break;
    case 'pin': S.insightPin = true; render(); break;
    case 'finishsup': { S.rest = null; finishFlow(true); break; }
    case 'chip': if (!S.done && !S.rest) { S.view = ex; if (!exDone(ex)) { const s = S.vals[ex].findIndex(v => !v.done); if (S.cur.ex !== ex && !isToday() && ex !== 0) S.cur = { ex, set: s }; if (isToday() && ex === 0) S.cur = { ex: 0, set: s }; } scrollTop(); render(); } else if (S.rest) { S.view = ex; scrollTop(); render(); } break;
    case 'exit': S.toast = { kind: 'msg', text: T().savedExit, left: 3 }; render(); break;
    case 'finish': S.confirm = true; render(); break;
    case 'confirmno': S.confirm = false; render(); break;
    case 'confirmyes': S.confirm = false; finishFlow(true); break;
    case 'restart': fresh(); render(); break;
    case 'demo': S.toast = { kind: 'msg', text: T().demoOnly, left: 2 }; render(); break;
  }
});
document.getElementById('restart').addEventListener('click', () => { fresh(); render(); });
document.getElementById('jump').addEventListener('click', () => { fresh('sup'); render(); });
document.getElementById('closeApp').addEventListener('click', () => {
  if (isToday()) {
    if (S.view > 0) { S.vals[1].forEach(v => v.done = false); S.vals[2].forEach(v => v.done = false); S.tt = { round: 0, t: [false, false], handoff: null, savedRounds: 0 }; S.rest = null; }
    S.toast = { kind: 'msg', text: T().closedLost, left: 5 };
  } else S.toast = { kind: 'msg', text: T().closedKept, left: 4 };
  render();
});
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { ui.lang = b.dataset.lang; render(); }));
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { ui.tab = +b.dataset.tab; fresh(S.startedSup ? 'sup' : undefined); render(); } });
document.getElementById('supOpts').addEventListener('click', e => { const b = e.target.closest('[data-sup]'); if (b && !isToday()) { ui.sup = +b.dataset.sup; fresh(S.view > 0 ? 'sup' : undefined); render(); } });
document.getElementById('speed').addEventListener('click', e => { const b = e.target.closest('[data-speed]'); if (b) { ui.speed = +b.dataset.speed; renderSide(); } });
try { const q = new URLSearchParams(location.search); if (q.get('lang') === 'es') ui.lang = 'es'; } catch (e) {}
fresh(); render();
</script>
</body>
</html>
