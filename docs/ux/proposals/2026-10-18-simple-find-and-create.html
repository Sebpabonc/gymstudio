<style>
:root{color-scheme:dark;--bg:#0f0f10;--soft:#171719;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.11);--text:#f3f3f1;--muted:#c8c7c4;--dim:rgba(243,243,241,.62);--brand:#8d5e63;--rose:#c99ca1;--brandsoft:rgba(141,94,99,.22);--btn:linear-gradient(135deg,#8d5e63,#5d3f43);--ok:#8fc79a;--amber:#e3b466;--danger:#e08a8a}
:root[data-theme="light"]{color-scheme:light;--bg:#f6f4f2;--soft:#ffffff;--panel:rgba(0,0,0,.04);--panel2:rgba(0,0,0,.07);--line:rgba(0,0,0,.12);--text:#18181a;--muted:#3d3c3a;--dim:rgba(24,24,26,.62);--rose:#8d5e63;--brandsoft:rgba(141,94,99,.14);--ok:#2f7a40;--amber:#9a6a12}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#050506;color:var(--text);font-family:Inter,'Segoe UI',-apple-system,sans-serif;font-size:14px;line-height:1.4;min-height:100vh;-webkit-font-smoothing:antialiased}
:root[data-theme="light"] body{background:#e9e6e3}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
/* control bar (prototype chrome, not app UI) */
.ctl{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 16px;background:#050506;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .ctl{background:#e9e6e3}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;font-weight:700;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--brandsoft);color:var(--rose)}
.ctl .lbl{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.stage{display:flex;justify-content:center;gap:24px;padding:16px 0 40px}
.phone{width:100%;max-width:375px;height:760px;max-height:max(560px,calc(100dvh - 116px));background:var(--bg);position:relative;overflow:hidden;border:1px solid var(--line);border-radius:28px}
.scr{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
@media(max-width:420px){.phone{border-radius:0;border-left:0;border-right:0}}
.notes{width:300px;color:var(--dim);font-size:12.5px;line-height:1.55;display:none}
.notes h3{color:var(--text);font-size:13px;margin:0 0 6px}
.notes li{margin:0 0 6px 16px}
.notes b{color:var(--rose)}
@media(min-width:760px){.notes{display:block}}
.mnotes{padding:12px 16px 24px;color:var(--dim);font-size:12.5px;line-height:1.55}
.mnotes li{margin:0 0 6px 16px}
@media(min-width:760px){.mnotes{display:none}}
.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 16px}
@media(max-width:600px){.steps{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}.steps::-webkit-scrollbar{display:none}.steps button{flex:none}.ctl .lbl{display:none}.ctl{gap:6px;padding:8px}.seg button{padding:0 10px}.stage{padding-top:0}}
.steps button{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--dim)}
.steps button[aria-current="step"]{border-color:var(--rose);color:var(--rose);background:var(--brandsoft)}
/* app header */
.hdr{padding:18px 16px 6px}
.brand{font-size:10px;letter-spacing:.18em;color:var(--dim);font-weight:700}
.brand b{display:block;font-size:24px;color:var(--text);font-weight:800;letter-spacing:.01em}
.hdr h1{font-size:15px;font-weight:700;color:var(--muted);margin-top:2px}
.wrap{padding:0 16px 120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--dim);font-weight:700;text-transform:uppercase}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.modes button{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px}
.modes button.on{background:var(--btn);color:#fff;border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;min-width:44px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brandsoft);border-color:var(--rose);color:var(--rose)}
.search{position:relative;margin-top:10px}
.search input{width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:0 44px 0 44px;font-size:16px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;color:var(--dim);font-size:18px}
.sec{margin-top:16px}
.sec .eyebrow{margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 4px;border-top:1px solid var(--line);text-align:left}
.row:first-of-type{border-top:0}
.row .eq{flex:none;width:36px;height:36px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.row .eq svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .badge{flex:none;font-size:10.5px;font-weight:700;color:var(--rose);border:1px solid rgba(201,156,161,.4);border-radius:6px;padding:2px 6px}
.row .chev{flex:none;color:var(--dim)}
.create{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin-top:8px;padding:8px 12px;border-radius:16px;border:1px dashed rgba(201,156,161,.5);color:var(--rose);font-weight:700;text-align:left}
.create span{font-size:22px;line-height:1}
.empty{color:var(--dim);font-size:13px;padding:12px 4px}
.big{width:100%;min-height:54px;border-radius:16px;background:var(--btn);color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em}
.big[disabled]{opacity:.45;cursor:not-allowed}
.ghost{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:650;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.link{min-height:44px;color:var(--rose);font-weight:650;font-size:13px;padding:0 4px}
/* bottom nav mock */
.nav{position:absolute;left:16px;right:16px;bottom:14px;height:58px;border-radius:30px;background:rgba(30,30,32,.92);border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}
:root[data-theme="light"] .nav{background:rgba(255,255,255,.95)}
.nav i{width:22px;height:22px;border-radius:6px;background:var(--panel2);display:block}
.nav i.on{background:var(--rose)}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--soft);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:8px 16px 22px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.shead h2{font-size:20px;font-weight:800;line-height:1.2;text-wrap:balance}
.shead h2 small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px}
.icbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:18px}
.cue{margin-top:12px;border-left:3px solid var(--amber);background:rgba(227,180,102,.1);border-radius:0 12px 12px 0;padding:10px 12px;font-size:14px}
.cue b{color:var(--amber)}
.last{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--panel);font-size:13.5px}
.last b{font-size:15px}
.last small{color:var(--dim);font-size:12px}
.menu{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.menu button{display:flex;justify-content:space-between;width:100%;min-height:48px;padding:0 14px;border-top:1px solid var(--line);text-align:left;font-size:14px}
.menu button:first-child{border-top:0}
.field{margin-top:14px}
.field label,.field .fl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:0 14px;font-size:16px}
.wrapchips{display:flex;flex-wrap:wrap;gap:6px}
.eqchip{display:flex;align-items:center;gap:6px}
.eqchip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.summ{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding:12px;border-radius:14px;background:var(--panel);font-size:13.5px}
.toast{position:absolute;left:16px;right:16px;bottom:86px;z-index:30;background:#24352a;color:#dff3e3;border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600}
:root[data-theme="light"] .toast{background:#dcefe0;color:#173d22}

.logger{margin-top:12px;border:1px solid var(--line);border-radius:18px;padding:12px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.step button{width:52px;height:56px;font-size:22px;background:var(--panel)}
.step .v{flex:1;text-align:center;font-size:24px;font-weight:800}
.step-l{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.1em;margin-bottom:4px}
.done{margin-top:10px;font-size:13px;color:var(--muted)}
.done li{list-style:none;padding:6px 0;border-top:1px solid var(--line)}

.b-label{font-size:11px;color:var(--dim);font-weight:700;margin:12px 0 6px}
.b-name{font-size:24px;font-weight:800;margin-top:2px}
.b-name span{color:var(--rose);font-size:18px}
.b-group{margin-top:10px}
.b-chip{display:inline-block;padding:7px 10px;border-radius:99px;border:1px solid var(--line);font-size:11px;font-weight:700;margin:4px 4px 0 0}
.b-cue{margin-top:12px;border:1px solid rgba(227,180,102,.5);background:rgba(227,180,102,.08);border-radius:14px;padding:12px;font-size:13px;display:flex;gap:10px;align-items:center}
.b-cue b{color:var(--amber)}
.b-cue i{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal}
.b-tile{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px}
.b-tile span{font-size:11px;color:var(--dim);letter-spacing:.08em}
.b-tile strong{display:block;font-size:18px}
.b-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.b-table th{color:var(--dim);font-weight:600;text-align:left;padding:4px 2px}
.b-table td{padding:6px 2px;border-top:1px solid var(--line)}
.b-mini{display:inline-flex;align-items:center;gap:2px}
.b-mini em{font-style:normal;display:inline-block;width:22px;height:30px;border:1px solid var(--line);border-radius:6px;text-align:center;line-height:28px}
.b-mini b{display:inline-block;width:26px;text-align:center}
.flag{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--danger);border:1px solid rgba(224,138,138,.45);border-radius:6px;padding:2px 6px}
.b-step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:6px}
.b-step i{font-style:normal;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center}
.b-text{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;margin-top:6px;padding:8px;color:var(--dim);font-size:12px}
.b-res{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:6px;background:var(--panel)}
.b-res small{display:block;color:var(--dim);font-size:11.5px}
</style>
</head>

function nm(e){return S.lang==='es'&&e.es?e.es:e.en}
function mus(m){return S.lang==='es'?(MUS_ES[m]||REG_ES[m]||m):m}

function bDay(){
  var h=header()+'<div class="wrap"><div class="modes"><button type="button" data-go="0">'+t('find')+'</button><button type="button" class="on">'+t('custom')+'</button></div>';
  h+='<div class="card"><div class="eyebrow">'+(S.lang==='es'?'Haz tu plan · MANUAL':'Make your plan · MANUAL')+'</div><p class="hint">'+t('bHint')+'</p><div class="chips" style="margin-top:8px"><span class="chip" style="display:flex;align-items:center;border-color:var(--rose);color:var(--rose)">'+(S.lang==='es'?'Día A':'Day A')+'</span><span class="chip" style="display:flex;align-items:center">+</span></div>';
  h+='<div class="two"><span class="ghost" style="display:flex;align-items:center;justify-content:center">'+t('bRename')+'</span><span class="ghost" style="display:flex;align-items:center;justify-content:center;opacity:.5">'+t('bDelete')+'</span></div><p class="empty">'+t('bEmpty')+'</p><button type="button" class="big" data-go="3">'+t('bAddEx')+'</button></div>';
  return h+'</div>';
}
function bAddSheet(){
  var h='<div class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+t('bAddTitle')+'"><div class="shead"><h2>'+t('bAddTitle')+'</h2><span class="ghost" style="width:auto;padding:0 14px;display:flex;align-items:center">'+t('close')+'</span></div>';
  h+='<div class="search"><input type="search" placeholder="'+t('bSearch')+'" style="padding-left:14px" readonly aria-label="'+t('bSearch')+'"></div><div class="chips" style="margin-top:8px">';
  ['All'].concat(['Glutes','Legs','Back','Chest','Shoulders','Arms','Core']).forEach(function(r){h+='<span class="chip" style="display:flex;align-items:center">'+(r==='All'?t('bAll'):reg(r))+'</span>'});
  h+='</div>';
  EX.slice(0,5).forEach(function(e){h+='<span class="b-res"><b>'+esc(nm(e))+'</b><small>'+mus(e.mus)+'</small></span>'});
  h+='<div class="flag">'+(S.lang==='es'?'227 filas · otro buscador (sin “rdl”, sin acentos, sin músculos)':'227 rows · a different search engine (no “rdl”, no accent-insensitive, no muscles)')+'</div>';
  h+='<button type="button" class="link" data-go="4" style="display:block;margin-top:8px">'+t('bCant')+'</button></section></div>';
  return h;
}
function bCreateSheet(){
  var h='<div class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+t('bCreateTitle')+'"><div class="shead"><h2>'+t('bCreateTitle')+'</h2><span class="ghost" style="width:auto;padding:0 14px;display:flex;align-items:center">'+t('close')+'</span></div>';
  h+='<div class="b-label">'+t('bName')+'</div><div class="search" style="margin-top:0"><input style="padding-left:14px" readonly aria-label="'+t('bName')+'"></div><div class="wrapchips" style="margin-top:10px">';
  ['Glutes','Legs','Back','Chest','Shoulders','Arms','Core'].forEach(function(r){h+='<span class="chip" style="display:flex;align-items:center">'+reg(r)+'</span>'});
  h+='</div><div class="flag">'+(S.lang==='es'?'chips sin título · obligatorio · sin equipo':'chips have no label · required · no equipment')+'</div>';
  [['bSets',3],['bMin',8],['bMax2',10]].forEach(function(p){h+='<div class="b-label">'+t(p[0])+'</div><div class="b-step"><i>−</i><b class="num">'+p[1]+'</b><i>+</i></div>'});
  h+='<div class="b-label">'+t('bRest')+'</div><div class="wrapchips">'+[60,90,120].map(function(s){return '<span class="chip" style="display:flex;align-items:center'+(s===90?';border-color:var(--rose);color:var(--rose)':'')+'">'+t('bRestS',{s:s})+'</span>'}).join('')+'</div>';
  h+='<div class="big" style="display:flex;align-items:center;justify-content:center;margin-top:12px;opacity:.5">'+t('bAddTo')+'</div><div class="flag">'+(S.lang==='es'?'11 controles · desactivado sin explicar':'11 controls · disabled with no reason given')+'</div></section></div>';
  return h;
}

/* ---------------- render ---------------- */
function screens(){return S.view==='before'?T[S.lang].sBefore:T[S.lang].sAfter}
function render(){
  document.documentElement.lang=S.lang;
  var ph=document.getElementById('phone'),h='';
  if(S.view==='before'){var bs=S.screen;h='<div class="scr">'+(bs<=1?bFind(bs===1):bDay())+'</div>'+nav()+(bs===3?bAddSheet():bs===4?bCreateSheet():'')}
  else{
    var base=(S.screen===9)?aDay():aFind();
    var over={3:aSheet,4:aSheet,5:aLog,6:aSwap,7:aCreate}[S.screen];
    h='<div class="scr">'+base+'</div>'+nav()+(over?over():'');
  }
  if(S.toast)h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  ph.innerHTML=h;
  var st=document.getElementById('steps');
  st.innerHTML=screens().map(function(s,i){return '<button type="button" data-step="'+i+'"'+(i===S.screen?' aria-current="step"':'')+'>'+(i+1)+'. '+esc(s)+'</button>'}).join('');
  var cur=st.querySelector('[aria-current]');if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
  var n=NOTES[S.view][S.lang];
  document.getElementById('notes').innerHTML=n[0]+'<ul>'+n.slice(1).map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
  document.getElementById('mnotes').innerHTML=n[0]+'<ul>'+n.slice(1).map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
  document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.view===S.view))});
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang))});
}
function go(i){
  S.screen=i;S.toast='';
  if(S.view==='after'){
    if(i===0){S.q='';S.reg='All';S.more=false}
    if(i===1){S.q='row';S.reg='All'}
    if(i===2){S.q=S.lang==='es'?'sentadilla hack':'hack squat';S.reg='All'}
    if(i===3){S.more=false;S.q='';S.reg='All'}
    if(i===4){S.more=true;S.q='';S.reg='All'}
    if(i===5){var e=byId(S.sel);S.setN=1;S.logged=[];S.kg=e&&e.last&&e.last!=='—'?parseFloat(e.last):20;S.reps=e&&e.last&&e.last!=='—'?parseInt(e.last.split('×')[1],10):10}
    if(i===7){S.cName=S.q.trim()||(S.lang==='es'?'Sentadilla hack':'Hack squat');S.cName=S.cName.charAt(0).toUpperCase()+S.cName.slice(1);S.cMus='';S.cEq='';S.cMoreOpen=false}
    if(i===8){if(!S.custom.length)addCustom(S.lang==='es'?'Sentadilla hack':'Hack squat','Legs','machine');S.q='';S.reg='All';S.screen=0;S.toast=t('cDone',{n:S.custom[S.custom.length-1].en})}
  }
  render();
}
function addCustom(name,m,eq){
  var id='custom-'+Math.random().toString(16).slice(2,10);
  S.custom.push({id:id,en:name,es:name,reg:m,mus:m,also:[],eq:eq,cue:null,last:'—',custom:true});
  S.sel=id;
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('button,[data-close]');if(!b)return;
  var d=b.dataset;
  if(d.view){S.view=d.view;go(0);return}
  if(d.lang){S.lang=d.lang;render();return}
  if(d.themeBtn){document.documentElement.dataset.theme=d.themeBtn;document.querySelectorAll('[data-theme-btn]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});return}
  if(d.step!==undefined){go(+d.step);return}
  if(d.close!==undefined&&ev.target===b){S.screen=S.screen===9?9:0;S.more=false;render();return}
  if(d.close!==undefined)return;
  if(d.go!==undefined){go(+d.go);return}
  if(d.reg){S.reg=d.reg;S.screen=(S.reg==='All'&&!S.q)?0:1;render();return}
  if(d.clear!==undefined){S.q='';S.screen=0;render();var q=document.getElementById('q');if(q)q.focus();return}
  if(d.open){S.sel=d.open;S.more=false;S.screen=3;render();return}
  if(d.more!==undefined){S.more=!S.more;S.screen=S.more?4:3;render();return}
  if(d.back!==undefined){S.screen=S.screen===7?0:3;render();return}
  if(d.addtoday!==undefined){S.screen=0;S.toast=t('addedToday');render();return}
  if(d.swapfor!==undefined){S.screen=0;S.toast=t('swapped');render();return}
  if(d.kg){S.kg=Math.max(0,S.kg+parseFloat(d.kg));render();return}
  if(d.reps){S.reps=Math.max(0,S.reps+parseInt(d.reps,10));render();return}
  if(d.logset!==undefined){S.logged.push(S.kg+' × '+S.reps);S.setN++;render();return}
  if(d.finish!==undefined){var n=S.logged.length;S.screen=0;S.toast=n?(n===1?t('logged1'):t('logged',{n:n})):'';render();return}
  if(d.create!==undefined){go(7);return}
  if(d.cmus){S.cMus=d.cmus;render();return}
  if(d.ceq){S.cEq=d.ceq;render();return}
  if(d.cmore!==undefined){S.cMoreOpen=!S.cMoreOpen;render();return}
  if(d.cdo!==undefined){if(b.disabled)return;addCustom(S.cName.trim(),S.cMus,S.cEq);S.q='';S.reg='All';S.screen=0;S.toast=t('cDone',{n:S.cName.trim()});render();return}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){S.q=ev.target.value;var pos=ev.target.selectionStart;S.screen=S.q.trim()?1:0;render();var q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}}
  if(ev.target.id==='cn'){S.cName=ev.target.value;var p2=ev.target.selectionStart;render();var c=document.getElementById('cn');if(c){c.focus();try{c.setSelectionRange(p2,p2)}catch(e){}}}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.view==='after'&&S.screen>=3&&S.screen<=7){S.screen=0;render()}});
render();
})();
</script>
</body>
</html>
