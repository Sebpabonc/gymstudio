<title>Squeeze Cue Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a row of phone-width cards (Current, A, B, C), each showing the cue in its real spot under the exercise tools. Single dark look on purpose: it mirrors the GymStudio app. */
:root {
  color-scheme: dark;
  --bg: #0b0b0c;
  --card: #18181a;
  --line: rgba(255, 255, 255, 0.11);
  --text: #f3f2f0;
  --muted: #a9a6a4;
  --rose: #c99ca1;
  --brand: #8d5e63;
  --rose-wash: rgba(141, 94, 99, 0.16);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { max-width: 1240px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.15rem; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; max-width: 60ch; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 700; min-width: 48px; min-height: 40px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--rose-wash); color: var(--rose); }
button:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.grid { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.opt { display: grid; gap: 8px; align-content: start; min-width: 0; }
.opt h2 { margin: 0; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rose); }
.opt h2 span { color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 500; margin-left: 6px; }
.phone { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 12px; }
.name { font-size: 1.15rem; font-weight: 600; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tools span { height: 40px; border: 1px solid var(--line); border-radius: 12px; display: grid; place-items: center; font-size: 0.7rem; font-weight: 600; color: var(--muted); }
.logger { height: 54px; border: 1px dashed var(--line); border-radius: 14px; display: grid; place-items: center; color: var(--muted); font-size: 0.75rem; }
.pitch { margin: 0; color: var(--muted); font-size: 0.83rem; line-height: 1.45; }

/* Current */
.cur { border-left: 3px solid var(--brand); background: rgba(226, 91, 116, 0.09); padding: 10px 12px; font-weight: 700; font-size: 1rem; line-height: 1.35; }

/* A · Label + text */
.a { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--rose-wash); border: 1px solid rgba(201, 156, 161, 0.22); text-align: left; color: inherit; font: inherit; width: 100%; cursor: pointer; }
.a .lab { display: flex; align-items: center; gap: 6px; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; color: var(--rose); }
.a .lab svg { width: 14px; height: 14px; }
.a .txt { display: block; margin-top: 4px; font-size: 0.98rem; font-weight: 600; line-height: 1.35; }
.a .chev { color: var(--rose); font-size: 1.2rem; }

/* B · One quiet line */
.b { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; width: 100%; }
.b svg { flex: none; width: 20px; height: 20px; color: var(--rose); margin-top: 1px; }
.b .txt { font-size: 0.98rem; font-weight: 600; line-height: 1.35; }
.b .more { display: block; margin-top: 4px; color: var(--rose); font-size: 0.8rem; font-weight: 600; }

/* C · Icon card */
.c { display: grid; grid-template-columns: 40px minmax(0, 1fr) 32px; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: linear-gradient(135deg, rgba(141, 94, 99, 0.30), rgba(141, 94, 99, 0.08)); border: 1px solid rgba(201, 156, 161, 0.30); color: inherit; font: inherit; text-align: left; width: 100%; cursor: pointer; }
.c .ic { width: 40px; height: 40px; border-radius: 12px; background: rgba(201, 156, 161, 0.18); display: grid; place-items: center; color: var(--rose); }
.c .ic svg { width: 22px; height: 22px; }
.c .lab { display: block; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; color: var(--rose); }
.c .txt { display: block; margin-top: 2px; font-size: 1rem; font-weight: 700; line-height: 1.3; }
.c .chev { width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text); }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.note { max-width: 1240px; margin: 18px auto 0; color: var(--muted); font-size: 0.82rem; }
@media (prefers-reduced-motion: no-preference) { .a, .c, .b { transition: transform 0.12s ease; } .a:active, .c:active, .b:active { transform: scale(0.99); } }
</style>

<header>
  <div>
    <h1 id="title">Squeeze cue · 3 options</h1>
    <p id="sub">The approved text stays the same. Only the box changes. Each option keeps "tap to open the details".</p>
  </div>
  <div class="seg" role="group" aria-label="Language">
    <button type="button" data-l="es" aria-pressed="true">ES</button>
    <button type="button" data-l="en" aria-pressed="false">EN</button>
  </div>
</header>

<main class="grid" id="grid"></main>
<p class="note" id="note"></p>

<script>
const ICON_TARGET = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
const T = {
  es: {
    title: 'Consejo "Aprieta" · 3 opciones',
    sub: 'El texto aprobado no cambia. Solo cambia la caja. Todas abren los detalles al tocar.',
    name: 'Sentadilla búlgara', label: 'Aprieta', cue: 'Estira el glúteo delantero, apriétalo al subir',
    tools: ['Técnica', 'Cambiar', 'Notas', 'Google'], logger: 'Registrar serie…', more: 'Ver técnica ›',
    opts: [
      ['Actual', '', 'Todo en negrita y la etiqueta pegada al texto: se lee pesado.'],
      ['A', 'Etiqueta + texto', 'Etiqueta pequeña en rosa arriba y el consejo debajo. Más limpia y fácil de leer de un vistazo. (Recomendada)'],
      ['B', 'Una línea discreta', 'Sin caja: icono y consejo en una línea, con "Ver técnica ›" debajo. Lo más simple.'],
      ['C', 'Tarjeta con icono', 'Tarjeta rosa con icono a la izquierda y flecha a la derecha. La más visible.'],
    ],
    note: 'Prototipo. Elige A, B o C y la aplico en ejercicios normales y superseries.',
  },
  en: {
    title: 'Squeeze cue · 3 options',
    sub: 'The approved text stays the same. Only the box changes. Every option opens the details on tap.',
    name: 'Bulgarian split squat', label: 'Squeeze', cue: 'Stretch front glute, squeeze it to stand',
    tools: ['Technique', 'Swap', 'Notes', 'Google'], logger: 'Log set…', more: 'See technique ›',
    opts: [
      ['Current', '', 'All bold with the label glued to the text: it reads heavy.'],
      ['A', 'Label + text', 'Small rose label on top, the cue below. Cleaner and quicker to read at a glance. (Recommended)'],
      ['B', 'One quiet line', 'No box: icon and cue in one line, with "See technique ›" underneath. The simplest.'],
      ['C', 'Icon card', 'Rose card with an icon on the left and an arrow on the right. The most visible.'],
    ],
    note: 'Prototype. Pick A, B or C and I apply it to single exercises and supersets.',
  },
};
let lang = 'es';
function cueHtml(k, t) {
  if (k === 0) return `<div class="cur">${t.label.toUpperCase()} · ${t.cue} <span style="color:var(--rose)">›</span></div>`;
  if (k === 1) return `<button type="button" class="a"><span><span class="lab">${ICON_TARGET}${t.label}</span><span class="txt">${t.cue}</span></span><span class="chev" aria-hidden="true">›</span></button>`;
  if (k === 2) return `<button type="button" class="b">${ICON_TARGET}<span><span class="txt">${t.cue}</span><span class="more">${t.more}</span></span></button>`;
  return `<button type="button" class="c"><span class="ic">${ICON_TARGET}</span><span><span class="lab">${t.label}</span><span class="txt">${t.cue}</span></span><span class="chev" aria-hidden="true">›</span></button>`;
}
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = t.title;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('note').textContent = t.note;
  document.querySelectorAll('[data-l]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
  document.getElementById('grid').innerHTML = t.opts.map(([id, name, pitch], k) => `
    <section class="opt">
      <h2>${id}${name ? `<span>${name}</span>` : ''}</h2>
      <div class="phone">
        <div class="name">${t.name}</div>
        <div class="tools">${t.tools.map((x) => `<span>${x}</span>`).join('')}</div>
        ${cueHtml(k, t)}
        <div class="logger">${t.logger}</div>
      </div>
      <p class="pitch">${pitch}</p>
    </section>`).join('');
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-l]'); if (b) { lang = b.dataset.l; render(); } });
render();
</script>
