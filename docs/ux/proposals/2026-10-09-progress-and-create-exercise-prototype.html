<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress and Plan Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f10;--soft:#171719;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.11);--text:#f3f3f1;--muted:#c8c7c4;--brand:#8d5e63;--accent:#c99ca1;--up:#9fd3a9;--down:#e3a38f;--flat:#bdb7b0}
*{box-sizing:border-box}body{margin:0;background:#000;font-family:Inter,system-ui,sans-serif;color:var(--text)}
.phone{max-width:375px;margin:0 auto;min-height:100vh;background:var(--bg);padding:12px 16px 90px;position:relative}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}h1{font-size:1.5rem;font-weight:800;margin:0}
.lang button,.seg button,.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 10px;font:600 .72rem Inter;cursor:pointer}
.lang button.on,.seg button.on,.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero h2{font-size:1.35rem;margin:0 0 4px;font-weight:800}.hero p{margin:0;color:var(--accent);font-weight:600;font-size:.85rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.kpi{background:var(--panel2);border-radius:12px;padding:8px}.kpi b{display:block;font-size:1.1rem}.kpi span{font-size:.65rem;color:var(--muted)}
h3{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.ins{display:flex;gap:10px;align-items:center}.ins .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.ins p{margin:0;font-size:.82rem;flex:1}.ins small{display:block;color:var(--muted);font-size:.68rem;margin-top:2px}
.pt{display:inline-block;font-size:.58rem;border:1px dashed var(--accent);color:var(--accent);border-radius:6px;padding:1px 5px;margin-left:4px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border:0}
.row .n{flex:1;font-size:.84rem;font-weight:600}.row .v{font-size:.75rem;color:var(--muted);width:62px;text-align:right}.row .d{font-size:.75rem;font-weight:700;width:44px;text-align:right}
.mus{display:grid;grid-template-columns:70px 1fr 34px;gap:6px;align-items:center;font-size:.72rem;margin:6px 0}.bar{height:7px;border-radius:4px;background:var(--panel2);position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.dots{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}.dots span{aspect-ratio:1;border-radius:4px;background:var(--panel2)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:375px;display:flex;background:var(--soft);border-top:1px solid var(--line)}nav button{flex:1;background:none;border:0;color:rgba(243,243,241,.55);padding:14px 0;font:600 .72rem Inter;cursor:pointer}nav button.on{color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}.sheet.open{display:flex}.sheet>div{background:var(--soft);width:100%;max-width:375px;border-radius:20px 20px 0 0;padding:16px;max-height:85vh;overflow:auto}
.btn{width:100%;background:linear-gradient(135deg,#7a5d60,#2f2f31);color:#fff;border:0;border-radius:14px;padding:13px;font:700 .85rem Inter;cursor:pointer;margin-top:10px}
.link{background:none;border:0;color:var(--accent);font:600 .78rem Inter;cursor:pointer;padding:8px 0}
input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px;font:500 .9rem Inter}
.step{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem}.step div{display:flex;align-items:center;gap:12px}.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:1.1rem;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
table{width:100%;font-size:.74rem;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid var(--line)}
.muted{color:var(--muted);font-size:.72rem}
</style></head><body><div class="phone" id="app"></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetBody"></div></div>
<script>
var lang='en',tab='progress',scope='block',day='A',filter='all',draft=null;
const T={en:{progress:'Progress',plan:'Make your plan',today:'Today',block:'This block',w4:'4 weeks',w12:'12 weeks',hero:'Stronger on 5 of 7 lifts',heroSub:'+6.2% average e1RM since block start',prs:'PRs',sessions:'Sessions',streak:'Week streak',insights:'Insights',lifts:'Main lifts',muscles:'Weekly sets per muscle',musSub:'This week vs avg of previous 3',cons:'Consistency (12 weeks)',hist:'Session history',i1:'Hip thrust up 9.8% (92 → 101 kg e1RM)',i1s:'Best mover this block',i2:'4 PRs this block',i2s:'Best: RDL 80 kg × 9',i3:'Shoulder press: no new best in 4 sessions',i3s:'Fact only, no advice',i4:'Glutes 18 sets this week (avg 14)',i4s:'Biggest change vs recent weeks',pt:'PT to approve',detail:'e1RM per session · dots = PR',date:'Date',best:'Best set',close:'Close',add:'+ Add exercise',search:'Search exercises',cant:"Can't find it? Create custom",name:'Exercise name',muscle:'Muscle',sets:'Sets',reps:'Reps',rest:'Rest',addTo:'Add to Day',save:'Save',del:'Remove',hint:'Pick exercises for each day. Tap one to edit, drag to reorder.',all:'All',glutes:'Glutes',legs:'Legs',back:'Back',chest:'Chest',shoulders:'Shoulders',arms:'Arms',todayTxt:'(Today screen unchanged in this prototype)'},
es:{progress:'Progreso',plan:'Arma tu plan',today:'Hoy',block:'Este bloque',w4:'4 semanas',w12:'12 semanas',hero:'Más fuerte en 5 de 7 ejercicios',heroSub:'+6,2% e1RM promedio desde el inicio del bloque',prs:'Récords',sessions:'Sesiones',streak:'Semanas seguidas',insights:'Hallazgos',lifts:'Ejercicios principales',muscles:'Series semanales por músculo',musSub:'Esta semana vs promedio de las 3 anteriores',cons:'Constancia (12 semanas)',hist:'Historial de sesiones',i1:'Hip thrust sube 9,8% (92 → 101 kg e1RM)',i1s:'El que más mejoró en el bloque',i2:'4 récords en este bloque',i2s:'Mejor: Peso muerto rumano 80 kg × 9',i3:'Press de hombro: sin nuevo máximo en 4 sesiones',i3s:'Solo el dato, sin consejo',i4:'Glúteos 18 series esta semana (prom. 14)',i4s:'Mayor cambio vs semanas recientes',pt:'PT debe aprobar',detail:'e1RM por sesión · puntos = récord',date:'Fecha',best:'Mejor serie',close:'Cerrar',add:'+ Agregar ejercicio',search:'Buscar ejercicios',cant:'¿No lo encuentras? Crear personalizado',name:'Nombre del ejercicio',muscle:'Músculo',sets:'Series',reps:'Reps',rest:'Descanso',addTo:'Agregar al Día',save:'Guardar',del:'Quitar',hint:'Elige ejercicios para cada día. Toca uno para editar, arrastra para ordenar.',all:'Todos',glutes:'Glúteos',legs:'Piernas',back:'Espalda',chest:'Pecho',shoulders:'Hombros',arms:'Brazos',todayTxt:'(Hoy sin cambios en este prototipo)'}};
const t=k=>T[lang][k];
const L=[{n:'Hip thrust',es:'Hip thrust',d:[91,93,95,94,98,100,102],pr:[1,2,4,5,6]},{n:'Romanian deadlift',es:'Peso muerto rumano',d:[84,85,85,87,86,88,88],pr:[3,5]},{n:'Bulgarian split squat',es:'Sentadilla búlgara',d:[40,41,42,42,43,44,44],pr:[1,2,4,5]},{n:'Lat pulldown',es:'Jalón al pecho',d:[55,55,57,57,58,58,59],pr:[2,4,6]},{n:'Leg press',es:'Prensa',d:[150,152,155,154,156,158,158],pr:[1,2,4,5]},{n:'Shoulder press',es:'Press de hombro',d:[26,27,28,28,28,28,28],pr:[1,2],flat:1},{n:'Cable row',es:'Remo en polea',d:[48,48,47,47,46,47,47],pr:[]}];
const M=[['glutes',18,14],['legs',12,13],['back',10,10],['shoulders',6,7],['chest',4,4],['arms',6,5]];
const lib=[['Hip thrust','glutes'],['Glute bridge','glutes'],['Cable kickback','glutes'],['Romanian deadlift','legs'],['Leg press','legs'],['Bulgarian split squat','legs'],['Lat pulldown','back'],['Cable row','back'],['Shoulder press','shoulders'],['Lateral raise','shoulders'],['Bench press','chest'],['Biceps curl','arms']];
const plan={A:[['Hip thrust',4,'8-10'],['Romanian deadlift',3,'10']],B:[['Lat pulldown',3,'10-12'],['Shoulder press',3,'8-10']]};
const pct=d=>{const a=(d[0]+d[1])/2,b=(d[d.length-1]+d[d.length-2])/2;return (b/a-1)*100};
const fmt=x=>(x>0?'+':'')+x.toFixed(1).replace('.',lang==='es'?',':'.')+'%';
function spark(d,w=70,h=22,pr=[]){const mn=Math.min(...d),mx=Math.max(...d),r=mx-mn||1;const p=d.map((v,i)=>[i*(w/(d.length-1)),h-3-(v-mn)/r*(h-6)]);return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="#c99ca1" stroke-width="1.8" points="${p.map(x=>x.join(',')).join(' ')}"/>${pr.map(i=>`<circle cx="${p[i][0]}" cy="${p[i][1]}" r="2.6" fill="#f3f3f1"/>`).join('')}</svg>`}
function col(x){return x>1?'var(--up)':x<-1?'var(--down)':'var(--flat)'}
function render(){const a=document.getElementById('app');document.documentElement.lang=lang;
let h=`<header><h1>${t(tab)}</h1><div class="lang"><button class="${lang==='en'?'on':''}" onclick="window.lang='en';render()">EN</button> <button class="${lang==='es'?'on':''}" onclick="window.lang='es';render()">ES</button></div></header>`;
if(tab==='progress'){h+=`<div class="seg">${['block','w4','w12'].map(s=>`<button class="${scope===s?'on':''}" onclick="scope='${s}';render()">${t(s)}</button>`).join('')}</div>
<section class="card hero"><h2>${t('hero')}</h2><p>${t('heroSub')}</p><div class="kpis"><div class="kpi"><b>4</b><span>${t('prs')}</span></div><div class="kpi"><b>11/12</b><span>${t('sessions')}</span></div><div class="kpi"><b>5</b><span>${t('streak')}</span></div></div><p class="muted" style="margin-top:8px;color:var(--muted);font-weight:400">±1% = ${lang==='en'?'flat':'estable'} <span class="pt">${t('pt')}</span></p></section>
<h3>${t('insights')}</h3>
${[['▲','var(--up)','i1',spark(L[0].d,60,20,L[0].pr)],['★','var(--accent)','i2',''],['▬','var(--flat)','i3',spark(L[5].d,60,20),1],['■','var(--accent)','i4','']].map(([ic,c,k,s,p])=>`<div class="card ins"><span class="ic" style="background:${c};color:#121314">${ic}</span><p>${t(k)}${p?`<span class="pt">${t('pt')}</span>`:''}<small>${t(k+'s')}</small></p>${s}</div>`).join('')}
<h3>${t('lifts')}</h3><div class="card" style="padding:4px 14px">${L.map((l,i)=>{const x=pct(l.d);return `<div class="row" onclick="openLift(${i})"><span class="n">${lang==='es'?l.es:l.n}</span>${spark(l.d,56,20)}<span class="v">${l.d[l.d.length-1]} kg</span><span class="d" style="color:${col(x)}">${fmt(x)}</span></div>`}).join('')}</div>
<h3>${t('muscles')}</h3><div class="card"><p class="muted" style="margin:0 0 6px">${t('musSub')}</p>${M.map(([m,a,b])=>`<div class="mus"><span>${t(m)}</span><div class="bar"><i style="width:${a/20*100}%;background:var(--brand)"></i><i style="width:2px;left:${b/20*100}%;background:#fff"></i></div><span>${a} <span class="muted">/${b}</span></span></div>`).join('')}<p class="muted" style="margin:8px 0 0">${lang==='en'?'White tick = previous average. No targets shown':'Marca blanca = promedio anterior. Sin metas'} <span class="pt">${t('pt')}</span></p></div>
${more()}<h3>${t('cons')}</h3><div class="card"><div class="dots">${Array.from({length:24},(_,i)=>`<span style="background:${[3,9,14].includes(i)?'var(--panel2)':i%2?'var(--brand)':'var(--accent)'}"></span>`).join('')}</div><p class="muted" style="margin:8px 0 0">${lang==='en'?'Each column = 1 week, 2 planned sessions':'Cada columna = 1 semana, 2 sesiones planeadas'}</p></div>
<details class="card"><summary style="font-weight:600;font-size:.85rem;cursor:pointer">${t('hist')}</summary><table>${['Oct 8 · Day B','Oct 6 · Day A','Oct 2 · Day B','Sep 29 · Day A'].map(s=>`<tr><td>${s}</td><td class="muted">5 ${lang==='en'?'exercises':'ejercicios'}</td></tr>`).join('')}</table></details>`}
else if(tab==='plan'){h+=`<p class="muted" style="margin:0 0 10px">${t('hint')}</p><div class="seg">${Object.keys(plan).map(d=>`<button class="${day===d?'on':''}" onclick="day='${d}';render()">${lang==='en'?'Day':'Día'} ${d}</button>`).join('')}<button onclick="plan[String.fromCharCode(65+Object.keys(plan).length)]=[];render()">+</button></div>
<div class="card" style="padding:4px 14px">${plan[day].length?plan[day].map((e,i)=>`<div class="row" onclick="openEdit(${i})"><span class="muted" style="width:16px">${i+1}</span><span class="n">${e[0]}</span><span class="v" style="width:80px">${e[1]} × ${e[2]}</span><span class="muted">≡</span></div>`).join(''):`<p class="muted">${lang==='en'?'No exercises yet.':'Aún no hay ejercicios.'}</p>`}</div>
<button class="btn" onclick="openAdd()">${t('add')}</button>`}
else h+=`<p class="muted">${t('todayTxt')}</p>`;
h+=`<nav>${['today','plan','progress'].map(k=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${t(k)}</button>`).join('')}</nav>`;a.innerHTML=h}
function sheet(html){document.getElementById('sheetBody').innerHTML=html;document.getElementById('sheet').classList.add('open')}
function closeSheet(){document.getElementById('sheet').classList.remove('open');render()}
function openLift(i){const l=L[i];sheet(`<h2 style="margin:0">${lang==='es'?l.es:l.n}</h2><p class="muted">${t('detail')}</p>${spark(l.d,340,120,l.pr)}<table><tr><td class="muted">${t('date')}</td><td class="muted">${t('best')}</td><td class="muted">e1RM</td></tr>${l.d.slice().reverse().map((v,j)=>`<tr><td>${['Oct 6','Oct 2','Sep 29','Sep 25','Sep 22','Sep 18','Sep 15'][j]}</td><td>${Math.round(v/1.3)} kg × 9</td><td>${v} kg</td></tr>`).join('')}</table><button class="btn" onclick="closeSheet()">${t('close')}</button>`)}
function openAdd(q=''){const res=lib.filter(([n,m])=>(filter==='all'||m===filter)&&n.toLowerCase().includes(q.toLowerCase()));
sheet(`<input id="q" placeholder="${t('search')}" value="${q}" oninput="openAdd(this.value)"><div class="chips">${['all','glutes','legs','back','chest','shoulders','arms'].map(m=>`<button class="chip ${filter===m?'on':''}" onclick="filter='${m}';openAdd(document.getElementById('q').value)">${t(m)}</button>`).join('')}</div>${res.map(([n,m])=>`<div class="row" onclick="openSteps('${n}')"><span class="n">${n}</span><span class="muted">${t(m)}</span></div>`).join('')}<button class="link" onclick="openCustom()">${t('cant')}</button>`);const i=document.getElementById('q');i.focus();i.setSelectionRange(q.length,q.length)}
function openCustom(){sheet(`<label class="muted">${t('name')}</label><input id="cn" style="margin:6px 0 12px"><label class="muted">${t('muscle')}</label><div class="chips">${['glutes','legs','back','chest','shoulders','arms'].map(m=>`<button class="chip" onclick="this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${t(m)}</button>`).join('')}</div><button class="btn" onclick="openSteps(document.getElementById('cn').value||'Custom')">→</button>`)}
function openSteps(n,idx){draft=idx!=null?{n,s:plan[day][idx][1],lo:+plan[day][idx][2].split('-')[0],hi:+(plan[day][idx][2].split('-')[1]||plan[day][idx][2]),r:90,idx}:{n,s:3,lo:8,hi:10,r:90};stepsView()}
function stepsView(){const d=draft;const st=(k,lab)=>`<div class="step"><span>${lab}</span><div><button onclick="draft.${k}=Math.max(1,draft.${k}-1);stepsView()">−</button><b>${d[k]}</b><button onclick="draft.${k}++;stepsView()">+</button></div></div>`;
sheet(`<h2 style="margin:0 0 6px">${d.n}</h2>${st('s',t('sets'))}${st('lo',t('reps')+' min')}${st('hi',t('reps')+' max')}<p class="muted" style="margin:12px 0 0">${t('rest')}</p><div class="chips">${[60,90,120].map(r=>`<button class="chip ${d.r===r?'on':''}" onclick="draft.r=${r};stepsView()">${r} s</button>`).join('')}</div><p class="muted">${lang==='en'?'Defaults from PT template when available':'Valores por defecto de la plantilla del PT si existe'} <span class="pt">${t('pt')}</span></p><button class="btn" onclick="saveDraft()">${d.idx!=null?t('save'):t('addTo')+' '+day}</button>${d.idx!=null?`<button class="link" onclick="plan[day].splice(${d.idx},1);closeSheet()">${t('del')}</button>`:''}`)}
function openEdit(i){openSteps(plan[day][i][0],i)}
function saveDraft(){const d=draft,r=d.lo===d.hi?''+d.lo:d.lo+'-'+d.hi;if(d.idx!=null)plan[day][d.idx]=[d.n,d.s,r];else plan[day].push([d.n,d.s,r]);closeSheet()}

const X=(en,es)=>lang==='es'?es:en;
function bars(v,w=300,h=56,hl=-1,lab=[]){const mx=Math.max(...v),bw=w/v.length;return `<svg width="100%" viewBox="0 0 ${w} ${h+12}">${v.map((x,i)=>`<rect x="${i*bw+2}" y="${h-x/mx*h}" width="${bw-4}" height="${x/mx*h}" rx="3" fill="${i===hl?'#c99ca1':'#8d5e63'}"/>${lab[i]?`<text x="${i*bw+bw/2}" y="${h+10}" fill="#c8c7c4" font-size="8" text-anchor="middle">${lab[i]}</text>`:''}`).join('')}</svg>`}
function split(a,b,la,lb){const p=a/(a+b)*100;return `<div class="bar" style="height:10px;margin:8px 0 4px"><i style="width:${p}%;background:var(--brand)"></i><i style="left:${p}%;right:0;width:auto;background:var(--accent)"></i></div><div class="muted" style="display:flex;justify-content:space-between"><span>${la} ${a}</span><span>${lb} ${b}</span></div>`}
function card(sent,sub,chart,pt){return `<div class="card"><p style="margin:0;font-size:.84rem;font-weight:600">${sent}${pt?`<span class="pt">${t('pt')}</span>`:''}</p><p class="muted" style="margin:2px 0 6px">${sub}</p>${chart}</div>`}
function more(){const wk=['W1','W2','W3','W4','W5','W6'],dw=X(['M','T','W','T','F','S','S'],['L','M','X','J','V','S','D']);return `
<h3>${X('Strength','Fuerza')}</h3>
${card(X('Hip thrust e1RM: new best-ever 102 kg','Hip thrust e1RM: nuevo máximo histórico 102 kg'),X('Line = session e1RM · white dots = best-ever at the time','Línea = e1RM por sesión · puntos = máximo histórico en su momento'),spark(L[0].d,300,60,L[0].pr))}
${card(X('3 rep PRs at the same weight','3 récords de reps con el mismo peso'),X('RDL 80 kg: 7 → 9 reps · Lat pulldown 55 kg: 10 → 12 · Leg press 140 kg: 10 → 11','RDL 80 kg: 7 → 9 reps · Jalón 55 kg: 10 → 12 · Prensa 140 kg: 10 → 11'),'')}
${card(X('Top-set load +7% vs last block','Carga de serie principal +7% vs bloque anterior'),X('Avg heaviest working set per main lift · Block 2 vs Block 3','Promedio de la serie más pesada por ejercicio · Bloque 2 vs 3'),split(64,69,X('Block 2','Bloque 2'),X('Block 3','Bloque 3')))}
${card(X('Most improved this block: Bulgarian split squat +10%','Más mejorado del bloque: Sentadilla búlgara +10%'),X('Largest first-vs-last e1RM change, ≥3 sessions','Mayor cambio de e1RM primera vs última, ≥3 sesiones'),spark(L[2].d,300,40))}
<h3>${X('Volume','Volumen')}</h3>
${card(X('Volume per session up 8% over 6 weeks','Volumen por sesión +8% en 6 semanas'),X('kg × reps of working sets per session, weekly average','kg × reps de series efectivas por sesión, promedio semanal'),bars([6.1,6.3,6.2,6.5,6.4,6.6],300,50,5,wk))}
${card(X('Block tonnage 38.4 t vs 34.9 t last block (+10%)','Tonelaje del bloque 38,4 t vs 34,9 t (+10%)'),X('Same number of block weeks compared (weeks 1–5)','Se comparan las mismas semanas del bloque (1–5)'),split(34.9,38.4,X('Block 2','Bloque 2'),X('Block 3','Bloque 3')))}
${card(X('Push 22 · Pull 26 sets in 4 weeks','Empuje 22 · Tirón 26 series en 4 semanas'),X('Working sets by movement pattern from the catalogue','Series efectivas por patrón de movimiento del catálogo'),split(22,26,X('Push','Empuje'),X('Pull','Tirón')),1)}
${card(X('Lower 58% · Upper 42% of sets','Tren inferior 58% · superior 42% de series'),X('Working sets by body region, last 4 weeks','Series efectivas por zona, últimas 4 semanas'),split(70,51,X('Lower','Inferior'),X('Upper','Superior')),1)}
<h3>${X('Effort and habits','Esfuerzo y hábitos')}</h3>
${card(X('Average RIR 2.1 → 1.6 this block','RIR promedio 2,1 → 1,6 en el bloque'),X('Mean RIR of sets where RIR was logged (62% of sets)','RIR promedio de las series con RIR registrado (62%)'),bars([2.1,2.0,1.9,1.8,1.7,1.6],300,40,5,wk),1)}
