name: CI

# Runs on every pull request: a PR should not be merged unless this passes.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test technical review gate
        run: python3 scripts/test-technical-review.py

      - name: Validate exercise catalogue
        run: python3 scripts/validate-catalogue.py

      - name: Validate training blocks
        run: python3 scripts/validate-blocks.py

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
