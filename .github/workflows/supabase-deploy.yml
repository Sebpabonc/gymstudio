name: Deploy Supabase (migrations + functions)

# Run by hand from the Actions tab (Tech Lead). "apply" off = dry run: shows the
# migrations that would be applied and changes nothing.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply migrations and deploy functions (off = dry run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gxcxnttbzechusggtxfz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned CLI from npm; setup-cli 'latest' hits the GitHub API rate limit.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase CLI
        run: npm install -g supabase@3.0.0 && supabase --version

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Migrations (dry run)
        if: ${{ !inputs.apply }}
        run: supabase db push --dry-run

      - name: Apply migrations
        if: ${{ inputs.apply }}
        run: supabase db push

      - name: Deploy ai-gateway
        if: ${{ inputs.apply }}
        run: supabase functions deploy ai-gateway --project-ref "$PROJECT_REF"
